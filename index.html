<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voyage dans l'histoire de la matière — Chronologie des Découvertes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #09090b;
      --bg-subtle: #0e0e12;
      --surface: #121216;
      --surface-hover: #18181d;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text: #f4f4f5;
      --text-secondary: #a1a1aa;
      --text-muted: #71717a;
      --accent: #38bdf8;
      --accent-muted: rgba(56, 189, 248, 0.12);
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', Consolas, monospace;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg);
    }
    ::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3f3f46;
    }

    /* ── Header ── */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(9, 9, 11, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      height: 64px;
    }

    .header-inner {
      max-width: 1440px;
      margin: 0 auto;
      height: 100%;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      flex-shrink: 0;
    }
    .brand-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
    }
    .brand-title {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text);
      transition: color 0.15s;
    }
    .brand:hover .brand-title {
      color: #ffffff;
    }

    .header-nav {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-nav-link {
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-secondary);
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 8px;
      transition: all 0.15s ease;
      cursor: pointer;
    }
    .header-nav-link:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.05);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .event-counter {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      margin-right: 4px;
    }

    .nav-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .nav-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--border-strong);
    }

    /* ── Landing Page / Hero ── */
    .landing-section {
      min-height: calc(100vh - 64px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 80px 24px 70px;
      position: relative;
      background: 
        radial-gradient(circle at 50% 15%, rgba(56, 189, 248, 0.09) 0%, transparent 55%),
        radial-gradient(circle at 80% 50%, rgba(99, 102, 241, 0.07) 0%, transparent 45%),
        radial-gradient(circle at 20% 70%, rgba(168, 85, 247, 0.06) 0%, transparent 50%),
        var(--bg);
      border-bottom: 1px solid var(--border);
    }

    .landing-hero {
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hero-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.76rem;
      font-weight: 500;
      color: var(--accent);
      background: var(--accent-muted);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 5px 14px;
      border-radius: 9999px;
      margin-bottom: 24px;
      letter-spacing: 0.02em;
    }
    .hero-tag-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      animation: badgeGlow 2s infinite ease-in-out;
    }

    .hero-title {
      font-size: clamp(2.4rem, 6vw, 4.3rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.15;
      color: #ffffff;
      margin-bottom: 36px;
      max-width: 950px;
    }
    .hero-highlight {
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 0;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #ffffff;
      color: #09090b;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 12px 26px;
      border-radius: 10px;
      text-decoration: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 20px rgba(255, 255, 255, 0.15);
      cursor: pointer;
    }
    .btn-primary:hover {
      background: #f4f4f5;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(255, 255, 255, 0.25);
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      font-size: 0.9rem;
      font-weight: 500;
      padding: 12px 24px;
      border-radius: 10px;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .btn-secondary:hover {
      background: var(--surface-hover);
      border-color: var(--border-strong);
      color: #ffffff;
      transform: translateY(-2px);
    }

    /* Stats Grid */
    .hero-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      width: 100%;
      max-width: 900px;
      margin-bottom: 60px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .stat-card:hover {
      border-color: var(--border-strong);
      transform: translateY(-2px);
    }
    .stat-num {
      font-size: 1.85rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.02em;
    }
    .stat-label {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* 3 Pillars */
    .pillars-container {
      width: 100%;
      max-width: 1040px;
      margin-top: 10px;
    }
    .pillars-header {
      margin-bottom: 24px;
      text-align: center;
    }
    .pillars-tag {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent);
    }
    .pillars-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #ffffff;
      margin-top: 6px;
      letter-spacing: -0.02em;
    }
    .pillars-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      text-align: left;
    }
    .pillar-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      transition: all 0.2s ease;
    }
    .pillar-card:hover {
      border-color: var(--border-strong);
      background: var(--surface-hover);
      transform: translateY(-2px);
    }
    .pillar-num {
      font-size: 0.76rem;
      font-weight: 700;
      font-family: var(--font-mono);
      color: var(--accent);
      margin-bottom: 12px;
    }
    .pillar-heading {
      font-size: 1.08rem;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 8px;
    }
    .pillar-desc {
      font-size: 0.88rem;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 16px;
      flex: 1;
    }
    .pillar-author {
      font-size: 0.74rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* ── Timeline Section & Sticky Arrow ── */
    .timeline-section {
      position: relative;
      background: var(--bg);
      border-top: 1px solid var(--border);
    }

    .arrow-container {
      position: sticky;
      top: 64px;
      z-index: 50;
      background: rgba(9, 9, 11, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
    }

    .arrow {
      display: flex;
      align-items: center;
      width: 100%;
      max-width: 1360px;
      margin: 0 auto;
    }

    .arrow-tail {
      width: 14px;
      height: 46px;
      background: #18181b;
      border: 1px solid var(--border-strong);
      border-right: none;
      border-radius: 8px 0 0 8px;
      flex-shrink: 0;
    }

    .arrow-shaft {
      flex: 1;
      height: 46px;
      background: #18181b;
      border-top: 1px solid var(--border-strong);
      border-bottom: 1px solid var(--border-strong);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      overflow-x: auto;
      scrollbar-width: none;
      gap: 4px;
    }
    .arrow-shaft::-webkit-scrollbar {
      display: none;
    }

    .arrow-head {
      width: 0;
      height: 0;
      border-top: 23px solid transparent;
      border-bottom: 23px solid transparent;
      border-left: 28px solid #18181b;
      flex-shrink: 0;
      position: relative;
      filter: drop-shadow(1px 0 0 rgba(255, 255, 255, 0.16));
      margin-left: -1px;
    }

    .arrow-event {
      color: var(--text-secondary);
      font-family: var(--font-sans);
      font-size: 0.76rem;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      white-space: nowrap;
      text-decoration: none;
    }
    .arrow-event:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
    }
    .arrow-event.active {
      color: #09090b;
      background: #ffffff;
      font-weight: 600;
      box-shadow: 0 2px 10px rgba(255, 255, 255, 0.2);
    }

    /* Event List (Horizontal viewport) */
    .events {
      list-style: none;
      display: flex;
      flex-direction: row;
      overflow-x: auto;
      scroll-behavior: smooth;
      scroll-snap-type: x mandatory;
      min-height: calc(100vh - 138px);
    }

    .event {
      min-width: 100vw;
      flex-shrink: 0;
      scroll-snap-align: start;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 52px 36px;
      position: relative;
      border-right: 1px solid rgba(255, 255, 255, 0.05);
    }

    .event-container {
      max-width: 1260px;
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 490px;
      gap: 52px;
      align-items: center;
    }

    /* Left Column: Context & Narrative */
    .event-info {
      display: flex;
      flex-direction: column;
    }

    .event-meta-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.74rem;
      font-weight: 500;
      color: var(--accent);
      background: var(--accent-muted);
      border: 1px solid rgba(56, 189, 248, 0.22);
      padding: 4px 12px;
      border-radius: 9999px;
      margin-bottom: 14px;
      align-self: flex-start;
      letter-spacing: 0.02em;
    }

    .event-title {
      font-size: 2.35rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.18;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .event-subtitle {
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .event-bubbles {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .event-bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 22px;
      color: var(--text);
      font-size: 0.925rem;
      line-height: 1.7;
      transition: all 0.2s ease;
    }
    .event-bubble:hover {
      border-color: var(--border-strong);
      background: var(--surface-hover);
      transform: translateY(-1px);
    }
    .event-bubble strong {
      color: #ffffff;
      font-weight: 600;
    }

    /* Key Words & Definitions Glossary Dropdown on each slide */
    .event-glossary {
      margin-top: 18px;
      background: rgba(18, 18, 22, 0.85);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 16px;
      transition: border-color 0.2s ease, background 0.2s ease;
    }
    .event-glossary:hover {
      border-color: rgba(56, 189, 248, 0.32);
      background: rgba(24, 24, 30, 0.92);
    }
    .event-glossary[open] {
      border-color: rgba(56, 189, 248, 0.28);
      background: rgba(18, 18, 22, 0.94);
    }
    .glossary-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      margin-bottom: 0;
      cursor: pointer;
      user-select: none;
      list-style: none;
    }
    .glossary-heading::-webkit-details-marker {
      display: none;
    }
    .event-glossary[open] .glossary-heading {
      margin-bottom: 10px;
      padding-bottom: 9px;
      border-bottom: 1px solid var(--border);
    }
    .glossary-heading-left {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }
    .glossary-count-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(56, 189, 248, 0.14);
      border: 1px solid rgba(56, 189, 248, 0.28);
      color: var(--accent);
      font-size: 0.65rem;
      font-weight: 600;
      padding: 1px 7px;
      border-radius: 9999px;
      letter-spacing: 0;
    }
    .glossary-toggle-label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--text-secondary);
      font-size: 0.68rem;
      font-weight: 500;
      text-transform: none;
      letter-spacing: 0.01em;
    }
    .glossary-toggle-text::before {
      content: "Afficher";
    }
    .event-glossary[open] .glossary-toggle-text::before {
      content: "Masquer";
    }
    .glossary-chevron {
      transition: transform 0.22s ease;
      color: var(--accent);
    }
    .event-glossary[open] .glossary-chevron {
      transform: rotate(180deg);
    }
    .glossary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 10px 16px;
    }
    .glossary-item {
      font-size: 0.82rem;
      line-height: 1.5;
      color: var(--text-secondary);
      border-left: 2px solid rgba(56, 189, 248, 0.35);
      padding-left: 10px;
    }
    .glossary-term {
      display: block;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 2px;
      font-size: 0.84rem;
    }

    /* Right Column: Media Stage (Animation / Photos) */
    .media-stage {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
    }

    /* Media Header / Switcher Tabs */
    .media-header {
      padding: 10px 14px;
      background: rgba(0, 0, 0, 0.3);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .media-segmented {
      display: inline-flex;
      background: #09090b;
      padding: 3px;
      border-radius: 8px;
      border: 1px solid var(--border);
      gap: 3px;
    }

    .media-tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .media-tab-btn:hover {
      color: var(--text);
    }
    .media-tab-btn.active {
      background: #27272a;
      color: #ffffff;
      font-weight: 600;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    }

    .media-static-title {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .media-count-tag {
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 6px;
    }

    /* Animation Styles */
    .anim-view {
      display: flex;
      flex-direction: column;
    }

    .anim-header {
      padding: 10px 14px;
      background: rgba(0, 0, 0, 0.15);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .anim-title {
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .anim-badge {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      display: inline-block;
      animation: badgeGlow 2s infinite ease-in-out;
    }

    @keyframes badgeGlow {
      0%, 100% { opacity: 0.6; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .anim-tag {
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 6px;
    }

    .anim-stage {
      background: #000000;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .anim-stage canvas {
      display: block;
      width: 100%;
      height: auto;
      max-height: 280px;
    }

    .anim-controls {
      padding: 10px 12px;
      background: #0d0d10;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
      border-top: 1px solid var(--border);
    }

    .anim-btn {
      background: #18181b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-secondary);
      font-size: 0.74rem;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
    }
    .anim-btn:hover {
      background: #27272a;
      color: #ffffff;
      border-color: var(--border-strong);
    }
    .anim-btn.active {
      background: #ffffff;
      color: #09090b;
      border-color: #ffffff;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(255, 255, 255, 0.15);
    }

    .anim-caption {
      padding: 12px 16px;
      font-size: 0.82rem;
      color: var(--text-secondary);
      line-height: 1.55;
      text-align: center;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }
    .anim-caption strong {
      color: #ffffff;
    }

    /* Photo Gallery View */
    .gallery-view {
      display: flex;
      flex-direction: column;
    }

    .gallery-viewer {
      position: relative;
      height: 285px;
      background: #000000;
      display: flex;
      align-items: center;

  /* MEDIA TAB SWITCHER */
  function switchMediaTab(eventIdx, tab) {
    const animEl = document.getElementById(`media-anim-${eventIdx}`);
    const photosEl = document.getElementById(`media-photos-${eventIdx}`);
    const tabBtns = document.querySelectorAll(`[data-tab-event="${eventIdx}"]`);

    tabBtns.forEach(btn => {
      btn.classList.toggle('active', btn.getAttribute('data-tab-target') === tab);
    });

    if (tab === 'anim') {
      if (animEl) animEl.style.display = 'flex';
      if (photosEl) photosEl.style.display = 'none';
    } else {
      if (animEl) animEl.style.display = 'none';
      if (photosEl) photosEl.style.display = 'block';
    }
  }

  /* PHOTO GALLERY CONTROLS */
  function selectPhoto(eventIdx, photoIdx) {
    const ev = events[eventIdx];
    if (!ev || !ev.photos[photoIdx]) return;
    galleryState[eventIdx] = photoIdx;

    const mainImg = document.getElementById(`gallery-main-${eventIdx}`);
    const countEl = document.getElementById(`gallery-count-${eventIdx}`);
    const capEl = document.getElementById(`gallery-cap-${eventIdx}`);
    const thumbContainer = document.getElementById(`gallery-thumbs-${eventIdx}`);

    if (mainImg) {
      mainImg.src = ev.photos[photoIdx].src;
      mainImg.alt = ev.photos[photoIdx].caption;
    }
    if (countEl) {
      countEl.textContent = `${photoIdx + 1} / ${ev.photos.length}`;
    }
    if (capEl) {
      capEl.textContent = ev.photos[photoIdx].caption;
    }
    if (thumbContainer) {
      const thumbs = thumbContainer.querySelectorAll('.gallery-thumb-btn');
      thumbs.forEach((th, idx) => th.classList.toggle('active', idx === photoIdx));
    }
  }

  function prevPhoto(eventIdx) {
    const total = events[eventIdx].photos.length;
    const nextIdx = (galleryState[eventIdx] - 1 + total) % total;
    selectPhoto(eventIdx, nextIdx);
  }

  function nextPhoto(eventIdx) {
    const total = events[eventIdx].photos.length;
    const nextIdx = (galleryState[eventIdx] + 1) % total;
    selectPhoto(eventIdx, nextIdx);
  }

  /* LIGHTBOX MODAL */
  function openLightbox(eventIdx) {
    lightboxState.eventIdx = eventIdx;
    lightboxState.photoIdx = galleryState[eventIdx] || 0;
    updateLightbox();
    const modal = document.getElementById('lightbox-modal');
    modal.classList.add('active');
  }

  function closeLightbox() {
    const modal = document.getElementById('lightbox-modal');
    modal.classList.remove('active');
  }

  function updateLightbox() {
    const ev = events[lightboxState.eventIdx];
    const photo = ev.photos[lightboxState.photoIdx];
    const imgEl = document.getElementById('lightbox-img');
    const capEl = document.getElementById('lightbox-caption');
    const cntEl = document.getElementById('lightbox-counter');

    if (imgEl && photo) {
      imgEl.src = photo.src;
      imgEl.alt = photo.caption;
    }
    if (capEl && photo) {
      capEl.textContent = photo.caption;
    }
    if (cntEl) {
      cntEl.textContent = `${ev.subtitle} · ${lightboxState.photoIdx + 1} / ${ev.photos.length}`;
    }
  }

  function lightboxPrev() {
    const ev = events[lightboxState.eventIdx];
    lightboxState.photoIdx = (lightboxState.photoIdx - 1 + ev.photos.length) % ev.photos.length;
    selectPhoto(lightboxState.eventIdx, lightboxState.photoIdx);
    updateLightbox();
  }

  function lightboxNext() {
    const ev = events[lightboxState.eventIdx];
    lightboxState.photoIdx = (lightboxState.photoIdx + 1) % ev.photos.length;
    selectPhoto(lightboxState.eventIdx, lightboxState.photoIdx);
    updateLightbox();
  }

  /* SCROLL HELPERS */
  function scrollToTimeline() {
    const timelineEl = document.getElementById('timeline');
    if (timelineEl) {
      const topOffset = timelineEl.getBoundingClientRect().top + window.pageYOffset - 52;
      window.scrollTo({ top: topOffset, behavior: 'smooth' });
    }
  }

  function scrollToLanding() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function navigateToEvent(idx) {
    if (idx < 0) idx = 0;
    if (idx >= events.length) idx = events.length - 1;
    const target = document.getElementById(`event-${idx}`);
    if (target) {
      eventList.scrollTo({ left: target.offsetLeft, behavior: 'smooth' });
    }
  }

  // Header Nav Links
  document.getElementById('brand-link').addEventListener('click', (e) => {
    e.preventDefault();
    scrollToLanding();
  });
  document.getElementById('nav-link-landing').addEventListener('click', (e) => {
    e.preventDefault();
    scrollToLanding();
  });
  document.getElementById('nav-link-timeline').addEventListener('click', (e) => {
    e.preventDefault();
    scrollToTimeline();
  });

  // Previous / Next Buttons in Header
  document.getElementById('btn-prev').addEventListener('click', () => {
    scrollToTimeline();
    navigateToEvent(currentEventIndex - 1);
  });
  document.getElementById('btn-next').addEventListener('click', () => {
    scrollToTimeline();
    navigateToEvent(currentEventIndex + 1);
  });

  // CTA buttons on landing
  const btnExploreTimeline = document.getElementById('btn-explore-timeline');
  if (btnExploreTimeline) {
    btnExploreTimeline.addEventListener('click', () => {
      scrollToTimeline();
    });
  }

  // IntersectionObserver for active arrow date & counter
  const cards = document.querySelectorAll('.event');
  const arrowLinks = document.querySelectorAll('.arrow-event');

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const idx = Array.from(cards).indexOf(entry.target);
        if (idx !== -1) {
          currentEventIndex = idx;
          arrowLinks.forEach((l, lIdx) => l.classList.toggle('active', lIdx === idx));
          if (counterEl) {
            counterEl.textContent = `${String(idx + 1).padStart(2, '0')} / ${String(events.length).padStart(2, '0')}`;
          }
          // Center active date horizontally in arrow shaft ONLY (never scroll window)
          const activeLink = document.getElementById(`arrow-link-${idx}`);
          if (activeLink && shaft) {
            const targetLeft = activeLink.offsetLeft - (shaft.clientWidth / 2) + (activeLink.clientWidth / 2);
            shaft.scrollTo({ left: targetLeft, behavior: 'smooth' });
          }
        }
      }
    });
  }, { root: eventList, rootMargin: '0px -40% 0px 0px', threshold: 0.1 });

  cards.forEach(c => observer.observe(c));

  // Mouse wheel horizontal translation inside timeline events list
  eventList.addEventListener('wheel', (e) => {
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX) && !e.ctrlKey) {
      eventList.scrollLeft += e.deltaY;
    }
  }, { passive: true });

  // Keyboard navigation
  window.addEventListener('keydown', (e) => {
    const modal = document.getElementById('lightbox-modal');
    const isLightboxOpen = modal && modal.classList.contains('active');

    if (isLightboxOpen) {
      if (e.key === 'Escape') closeLightbox();
      else if (e.key === 'ArrowLeft') lightboxPrev();
      else if (e.key === 'ArrowRight') lightboxNext();
    } else {
      const timelineRect = document.getElementById('timeline').getBoundingClientRect();
      if (timelineRect.top < window.innerHeight && timelineRect.bottom > 100) {
        if (e.key === 'ArrowLeft') navigateToEvent(currentEventIndex - 1);
        else if (e.key === 'ArrowRight') navigateToEvent(currentEventIndex + 1);
      }
    }
  });

  /* ══════════════════════════════════════════════════════════════
     INTERACTIVE ANIMATION ENGINES (FROM SCRATCH)
  ══════════════════════════════════════════════════════════════ */

  function getDPRCanvas(id, w, h) {
    const canvas = document.getElementById(id);
    if (!canvas) return null;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    return { canvas, ctx, w, h };
  }

  /* ── 1. BIG BANG ENGINE ── */
  (function initBigBang() {
    const cData = getDPRCanvas('canvas-bb', 460, 270);
    if (!cData) return;
    const { ctx, w, h } = cData;
    const cx = w / 2, cy = h / 2;

    let time = 0; // 0 to 13.8
    let playing = true;

    // Generate cosmic particles
    const particles = Array.from({ length: 90 }, () => {
      const angle = Math.random() * Math.PI * 2;
      const speed = 0.5 + Math.random() * 1.5;
      const color = ['#60a5fa', '#f472b6', '#a78bfa', '#fde047', '#34d399', '#ffffff'][Math.floor(Math.random() * 6)];
      return { angle, speed, color, r: 1 + Math.random() * 1.5 };
    });

    // Generate galaxies with rotating spiral arms
    const galaxies = [
      { angle: 0.5, distFactor: 1.1, color: '#93c5fd', name: 'Voie Lactée', arms: 2, rotSpeed: 0.02 },
      { angle: 2.1, distFactor: 0.9, color: '#f472b6', name: 'Andromède', arms: 2, rotSpeed: -0.015 },
      { angle: 3.7, distFactor: 1.2, color: '#a78bfa', name: 'Galaxie C', arms: 3, rotSpeed: 0.018 },
      { angle: 5.1, distFactor: 0.85, color: '#34d399', name: 'Galaxie D', arms: 2, rotSpeed: -0.025 }
    ];

    function draw() {
      if (playing) {
        time += 0.045;
        if (time > 13.8) time = 13.8;
      }

      // Update badge
      const badge = document.getElementById('bb-time-badge');
      if (badge) badge.textContent = `t = ${time.toFixed(1)} Ga`;

      // Background gradient
      const bgGrad = ctx.createRadialGradient(cx, cy, 10, cx, cy, 240);
      bgGrad.addColorStop(0, '#1a102e');
      bgGrad.addColorStop(0.5, '#0b0f1e');
      bgGrad.addColorStop(1, '#05070f');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, w, h);

      // Expanding metric grid
      ctx.save();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
      ctx.lineWidth = 1;
      const expansionFactor = 1 + (time / 13.8) * 1.6;
      const gridStep = 32 * expansionFactor;
      for (let x = (cx % gridStep); x < w; x += gridStep) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
      }
      for (let y = (cy % gridStep); y < h; y += gridStep) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
      }
      ctx.restore();

      // Shockwave rings
      const waveProgress = (time / 13.8);
      for (let i = 1; i <= 3; i++) {
        const ringT = (waveProgress * 2.5 - i * 0.3);
        if (ringT > 0 && ringT < 1.4) {
          ctx.beginPath();
          ctx.arc(cx, cy, ringT * 150, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(96, 165, 250, ${Math.max(0, (1 - ringT / 1.4) * 0.4)})`;
          ctx.lineWidth = 2;
          ctx.stroke();
        }
      }

      // Flying particles (Hubble drift)
      particles.forEach(p => {
        const d = p.speed * time * 12;
        const px = cx + Math.cos(p.angle) * d;
        const py = cy + Math.sin(p.angle) * d;
        if (px >= 0 && px <= w && py >= 0 && py <= h) {
          ctx.beginPath();
          ctx.arc(px, py, p.r, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = Math.min(1, time / 1.5);
          ctx.fill();
        }
      });
      ctx.globalAlpha = 1;

      // Rotating spiral galaxies
      galaxies.forEach((g, idx) => {
        const gDist = (time / 13.8) * 140 * g.distFactor;
        const gx = cx + Math.cos(g.angle) * gDist;
        const gy = cy + Math.sin(g.angle) * gDist;

        ctx.save();
        ctx.translate(gx, gy);
        ctx.rotate(time * g.rotSpeed * 10);

        // Core glow
        const coreGlow = ctx.createRadialGradient(0, 0, 1, 0, 0, 12);
        coreGlow.addColorStop(0, '#ffffff');
        coreGlow.addColorStop(0.4, g.color);
        coreGlow.addColorStop(1, 'transparent');
        ctx.fillStyle = coreGlow;
        ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();

        // Spiral arms
        ctx.strokeStyle = g.color;
        ctx.lineWidth = 1.5;
        for (let a = 0; a < g.arms; a++) {
          ctx.beginPath();
          const armAngleOffset = (a * Math.PI * 2) / g.arms;
          for (let r = 2; r < 18; r += 2) {
            const theta = armAngleOffset + r * 0.35;
            const ax = Math.cos(theta) * r;
            const ay = Math.sin(theta) * r;
            if (r === 2) ctx.moveTo(ax, ay); else ctx.lineTo(ax, ay);
          }
          ctx.stroke();
        }

        ctx.restore();

        // Name and distance vector
        if (time > 2.5) {
          ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
          ctx.font = '8.5px Segoe UI, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(g.name, gx, gy + 22);

          // Distance velocity line
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
          ctx.setLineDash([2, 3]);
          ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(gx, gy); ctx.stroke();
          ctx.setLineDash([]);
        }
      });

      // Central initial singularity / primordial core
      const coreR = Math.max(2, 10 - (time / 13.8) * 7);
      const coreGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreR * 3);
      coreGrad.addColorStop(0, '#ffffff');
      coreGrad.addColorStop(0.4, '#fde047');
      coreGrad.addColorStop(0.8, '#ef4444');
      coreGrad.addColorStop(1, 'transparent');
      ctx.fillStyle = coreGrad;
      ctx.beginPath(); ctx.arc(cx, cy, coreR * 3, 0, Math.PI * 2); ctx.fill();

      // Core center point
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(cx, cy, coreR, 0, Math.PI * 2); ctx.fill();

      // Timeline bar at bottom
      ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
      ctx.fillRect(40, h - 16, w - 80, 4);
      ctx.fillStyle = '#60a5fa';
      ctx.fillRect(40, h - 16, ((w - 80) * (time / 13.8)), 4);

      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);

    // Controls
    const restartBtn = document.getElementById('btn-bb-restart');
    if (restartBtn) restartBtn.addEventListener('click', () => { time = 0; playing = true; });
    const toggleBtn = document.getElementById('btn-bb-toggle');
    if (toggleBtn) toggleBtn.addEventListener('click', () => {
      playing = !playing;
      toggleBtn.textContent = playing ? '⏸ Pause' : '▶ Lecture';
    });
  })();

  /* ── 2. JANSSEN MICROSCOPE ENGINE (CONCRETE & CLEAR) ── */
  (function initJanssen() {
    const cData = getDPRCanvas('canvas-janssen', 460, 270);
    if (!cData) return;
    const { ctx, w, h } = cData;

    let step = 3; // 1: Œil nu (×1), 2: Loupe (×3), 3: 2 Lentilles (×10)
    let animPulse = 0;

    // Helper to draw an insect / flea specimen at given scale
    function drawSpecimen(ox, oy, scale, showDetails) {
      ctx.save();
      ctx.translate(ox, oy);
      ctx.scale(scale, scale);

      if (scale < 0.25) {
        // Naked eye: a tiny speck
        ctx.fillStyle = '#111827';
        ctx.beginPath(); ctx.arc(0, 0, 2.5, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
        return;
      }

      // Thorax & Abdomen
      ctx.fillStyle = '#92400e';
      ctx.beginPath(); ctx.ellipse(-2, 4, 12, 16, 0.2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#b45309';
      ctx.beginPath(); ctx.ellipse(0, -10, 8, 8, 0, 0, Math.PI * 2); ctx.fill();

      // Head
      ctx.fillStyle = '#78350f';
      ctx.beginPath(); ctx.ellipse(4, -18, 5, 5, 0.3, 0, Math.PI * 2); ctx.fill();

      if (showDetails) {
        // Detailed antenna
        ctx.strokeStyle = '#451a03'; ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(6, -21); ctx.quadraticCurveTo(12, -28, 16, -24);
        ctx.moveTo(4, -22); ctx.quadraticCurveTo(8, -30, 11, -32);
        ctx.stroke();

        // Eye facets
        ctx.fillStyle = '#ef4444';
        ctx.beginPath(); ctx.arc(6, -19, 1.8, 0, Math.PI * 2); ctx.fill();

        // 6 segmented jointed legs
        ctx.strokeStyle = '#78350f'; ctx.lineWidth = 1.5;
        const legOffsets = [[-2, -6], [-4, 2], [-6, 12]];
        legOffsets.forEach(([lx, ly], i) => {
          // Left leg
          ctx.beginPath();
          ctx.moveTo(lx, ly);
          ctx.lineTo(lx - 12, ly + (i===2?14:4));
          ctx.lineTo(lx - 20, ly + (i===2?26:12));
          ctx.stroke();
          // Right leg
          ctx.beginPath();
          ctx.moveTo(lx + 4, ly);
          ctx.lineTo(lx + 16, ly + (i===2?16:6));
          ctx.lineTo(lx + 24, ly + (i===2?28:16));
          ctx.stroke();
        });

        // Abdomen segmentation rings
        ctx.strokeStyle = '#78350f'; ctx.lineWidth = 1;
        for (let r = -4; r <= 14; r += 4) {
          ctx.beginPath(); ctx.moveTo(-10, r); ctx.lineTo(6, r + 2); ctx.stroke();
        }
      } else {
        // Simple blurry outline for 1-lens loupe
        ctx.strokeStyle = '#78350f'; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-12, 10); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(2, 0); ctx.lineTo(14, 12); ctx.stroke();
      }

      ctx.restore();
    }

    function draw() {
      animPulse = (animPulse + 0.04) % (Math.PI * 2);

      // Spatial void background
      ctx.fillStyle = '#030712';
      ctx.fillRect(0, 0, w, h);

      // Left Section: The Microscope Device setup (x: 14 to 255)
      ctx.fillStyle = 'rgba(12, 18, 36, 0.9)';
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.25)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.roundRect(14, 14, 240, 242, 6); ctx.fill(); ctx.stroke();

      // Section title
      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 9.5px Segoe UI, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText("DISPOSITIF OPTIQUE", 24, 32);

      // Specimen slide at x=36
      ctx.fillStyle = 'rgba(30, 41, 59, 0.9)';
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 1.5;
      ctx.fillRect(32, 70, 8, 110);
      ctx.strokeRect(32, 70, 8, 110);

      // Specimen sample (tiny speck on slide)
      drawSpecimen(36, 125, 0.18, false);

      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 8px Segoe UI, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText("Échantillon", 36, 62);
      ctx.font = '7px Segoe UI, sans-serif';
      ctx.fillStyle = '#94a3b8';
      ctx.fillText("(minuscule)", 36, 192);

      // Microscope tube body (cross-section)
      const tubeY = 85, tubeH = 80;
      ctx.fillStyle = 'rgba(14, 165, 233, 0.12)';
      ctx.strokeStyle = '#0284c7';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.roundRect(64, tubeY, 155, tubeH, 4); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 8px Segoe UI, sans-serif';
      ctx.fillText("Tube du microscope", 140, tubeY + 14);

      // Axis
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.2)';
      ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.moveTo(36, 125); ctx.lineTo(240, 125); ctx.stroke();
      ctx.setLineDash([]);

      // Light beams and Lenses based on current step
      if (step === 1) {
        // Step 1: Eye looking directly without lenses
        ctx.fillStyle = 'rgba(239, 68, 68, 0.1)';
        ctx.beginPath(); ctx.moveTo(36, 125); ctx.lineTo(235, 110); ctx.lineTo(235, 140); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#f87171'; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(36, 125); ctx.lineTo(235, 110); ctx.moveTo(36, 125); ctx.lineTo(235, 140); ctx.stroke();

        ctx.fillStyle = '#f87171'; ctx.font = 'bold 9px Segoe UI, sans-serif';
        ctx.fillText("Pas de lentille : l'œil ne voit rien !", 140, 155);
      } else if (step === 2) {
        // Step 2: 1 Single Lens (Loupe)
        const l1x = 95;
        ctx.fillStyle = 'rgba(56, 189, 248, 0.35)'; ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.ellipse(l1x, 125, 6, 32, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#38bdf8'; ctx.font = 'bold 8px Segoe UI, sans-serif';
        ctx.fillText("Lentille 1", l1x, 82);
        ctx.fillText("(Loupe)", l1x, 175);

        // Cone of light expanding through lens 1
        ctx.fillStyle = 'rgba(56, 189, 248, 0.12)';
        ctx.beginPath(); ctx.moveTo(36, 125); ctx.lineTo(l1x, 100); ctx.lineTo(235, 88); ctx.lineTo(235, 162); ctx.lineTo(l1x, 150); ctx.closePath(); ctx.fill();

        ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(36, 125); ctx.lineTo(l1x, 100); ctx.lineTo(235, 88); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(36, 125); ctx.lineTo(l1x, 150); ctx.lineTo(235, 162); ctx.stroke();

        // Intermediate preview
        drawSpecimen(170, 125, 0.4, false);
        ctx.fillStyle = '#38bdf8'; ctx.font = 'bold 7.5px Segoe UI, sans-serif';
        ctx.fillText("Agrandissement ×3", 170, 155);
      } else if (step === 3) {
        // Step 3: Two lenses combined (Janssen compound microscope)
        const l1x = 88;  // Objectif
        const l2x = 188; // Oculaire

        // Lens 1: Objectif
        ctx.fillStyle = 'rgba(56, 189, 248, 0.45)'; ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.ellipse(l1x, 125, 5, 26, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#38bdf8'; ctx.font = 'bold 8px Segoe UI, sans-serif';
        ctx.fillText("1. Objectif", l1x, 82);
        ctx.font = '7px Segoe UI, sans-serif'; ctx.fillText("(près de l'objet)", l1x, 162);

        // Intermediate image in the middle
        const imgMidX = 138;
        drawSpecimen(imgMidX, 125, -0.4, true);
        ctx.fillStyle = '#fbbf24'; ctx.font = 'bold 7px Segoe UI, sans-serif';
        ctx.fillText("Image 1 (×3)", imgMidX, 150);

        // Lens 2: Oculaire
        ctx.fillStyle = 'rgba(168, 85, 247, 0.45)'; ctx.strokeStyle = '#a855f7'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.ellipse(l2x, 125, 7, 34, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#c084fc'; ctx.font = 'bold 8px Segoe UI, sans-serif';
        ctx.fillText("2. Oculaire", l2x, 82);
        ctx.font = '7px Segoe UI, sans-serif'; ctx.fillText("(près de l'œil)", l2x, 170);

        // Light rays cascading through both lenses
        ctx.fillStyle = 'rgba(168, 85, 247, 0.12)';
        ctx.beginPath();
        ctx.moveTo(36, 125); ctx.lineTo(l1x, 106); ctx.lineTo(imgMidX, 138); ctx.lineTo(l2x, 96); ctx.lineTo(235, 78);
        ctx.lineTo(235, 172); ctx.lineTo(l2x, 154); ctx.lineTo(imgMidX, 112); ctx.lineTo(l1x, 144); ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = '#a855f7'; ctx.lineWidth = 1.3;
        ctx.beginPath();
        ctx.moveTo(36, 125); ctx.lineTo(l1x, 106); ctx.lineTo(imgMidX, 138); ctx.lineTo(l2x, 96); ctx.lineTo(235, 78);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(36, 125); ctx.lineTo(l1x, 144); ctx.lineTo(imgMidX, 112); ctx.lineTo(l2x, 154); ctx.lineTo(235, 172);
        ctx.stroke();

        // Multiplied badge inside left section
        ctx.fillStyle = 'rgba(14, 165, 233, 0.15)'; ctx.strokeStyle = 'rgba(56, 189, 248, 0.4)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.roundRect(68, 222, 148, 22, 4); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#38bdf8'; ctx.font = 'bold 8.5px Segoe UI, sans-serif';
        ctx.fillText("×3  MULTIPLIÉ PAR  ×3.3  =  ×10 !", 142, 236);
      }

      // Eye observer icon at x=238
      ctx.strokeStyle = '#38bdf8'; ctx.fillStyle = '#0f172a'; ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(234, 125); ctx.quadraticCurveTo(243, 117, 252, 125); ctx.quadraticCurveTo(243, 133, 234, 125); ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#38bdf8'; ctx.beginPath(); ctx.arc(243, 125, 3.5, 0, Math.PI * 2); ctx.fill();

      // Right Section: The Observer's Eyepiece View (What the eye sees!)
      const viewCX = 362, viewCY = 120, viewR = 64;

      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 9.5px Segoe UI, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText("CE QUE L'ŒIL OBSERVE", viewCX, 32);

      // Brass eyepiece frame
      ctx.save();
      ctx.beginPath(); ctx.arc(viewCX, viewCY, viewR, 0, Math.PI * 2); ctx.clip();

      // Spatial optical field backdrop
      const lampGrad = ctx.createRadialGradient(viewCX, viewCY, 10, viewCX, viewCY, viewR);
      lampGrad.addColorStop(0, '#1e293b');
      lampGrad.addColorStop(0.65, '#0f172a');
      lampGrad.addColorStop(1, '#020617');
      ctx.fillStyle = lampGrad;
      ctx.fillRect(viewCX - viewR, viewCY - viewR, viewR * 2, viewR * 2);

      // Circular reticle grid lines
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.25)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(viewCX, viewCY, 30, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(viewCX - viewR, viewCY); ctx.lineTo(viewCX + viewR, viewCY); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(viewCX, viewCY - viewR); ctx.lineTo(viewCX, viewCY + viewR); ctx.stroke();

      // Draw specimen inside eyepiece view according to step
      if (step === 1) {
        drawSpecimen(viewCX, viewCY, 0.18, false);
      } else if (step === 2) {
        drawSpecimen(viewCX, viewCY, 0.6, false);
      } else if (step === 3) {
        drawSpecimen(viewCX, viewCY, 1.8, true);
      }

      ctx.restore();

      // Bezel border
      ctx.strokeStyle = '#0284c7'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(viewCX, viewCY, viewR, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(viewCX, viewCY, viewR - 2.5, 0, Math.PI * 2); ctx.stroke();

      // Caption below eyepiece
      ctx.textAlign = 'center';
      if (step === 1) {
        ctx.fillStyle = '#f87171'; ctx.font = 'bold 9px Segoe UI, sans-serif';
        ctx.fillText("À l'œil nu (×1) : presque invisible", viewCX, viewCY + viewR + 18);
        ctx.fillStyle = '#94a3b8'; ctx.font = '7.5px Segoe UI, sans-serif';
        ctx.fillText("Un simple point sombre sans détails", viewCX, viewCY + viewR + 30);
      } else if (step === 2) {
        ctx.fillStyle = '#fbbf24'; ctx.font = 'bold 9px Segoe UI, sans-serif';
        ctx.fillText("Une seule lentille (×3) : loupe", viewCX, viewCY + viewR + 18);
        ctx.fillStyle = '#94a3b8'; ctx.font = '7.5px Segoe UI, sans-serif';
        ctx.fillText("Forme visible, mais floue et limitée", viewCX, viewCY + viewR + 30);
      } else if (step === 3) {
        ctx.fillStyle = '#38bdf8'; ctx.font = 'bold 9px Segoe UI, sans-serif';
        ctx.fillText("2 Lentilles Janssen (×10) : net !", viewCX, viewCY + viewR + 18);
        ctx.fillStyle = '#94a3b8'; ctx.font = '7.5px Segoe UI, sans-serif';
        ctx.fillText("Antennes, pattes et yeux révélés !", viewCX, viewCY + viewR + 30);
      }

      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);

    // Button controls
    const s1 = document.getElementById('btn-janssen-s1');
    const s2 = document.getElementById('btn-janssen-s2');
    const s3 = document.getElementById('btn-janssen-s3');
    const tag = document.getElementById('janssen-step-tag');

    function setStep(newStep, activeBtn, text) {
      step = newStep;
      [s1, s2, s3].forEach(b => { if (b) b.classList.remove('active'); });
      if (activeBtn) activeBtn.classList.add('active');
      if (tag) tag.textContent = text;
    }

    if (s1) s1.addEventListener('click', () => setStep(1, s1, "1. Sans microscope (×1)"));
    if (s2) s2.addEventListener('click', () => setStep(2, s2, "2. Simple loupe (×3)"));
    if (s3) s3.addEventListener('click', () => setStep(3, s3, "3. Deux lentilles combinées (×10)"));
  })();

  /* ── 3. HOOKE CORK CELLS ENGINE ── */
  (function initHooke() {
    const cData = getDPRCanvas('canvas-hooke', 460, 270);
    if (!cData) return;
    const { ctx, w, h } = cData;
    const cx = 230, cy = 135, r = 110;

    let focus = 1.0;
    let focusDirection = -1;
    let autoFocus = false;
    let scanAngle = 0;
    let selectedCellIdx = 22;

    // Generate honeycomb cork cell grid
    const cells = [];
    const hexRadius = 15;
    for (let q = -6; q <= 6; q++) {
      for (let rIdx = -5; rIdx <= 5; rIdx++) {
        const hx = cx + hexRadius * Math.sqrt(3) * (q + rIdx / 2);
        const hy = cy + hexRadius * (3/2) * rIdx;
        const distFromCenter = Math.hypot(hx - cx, hy - cy);
        if (distFromCenter < r - 6) {
          cells.push({ x: hx, y: hy, dist: distFromCenter });
        }
      }
    }

    function draw() {
      if (autoFocus) {
        focus += focusDirection * 0.008;
        if (focus <= 0.25) { focus = 0.25; focusDirection = 1; }
        if (focus >= 1.0) { focus = 1.0; focusDirection = -1; }
      }
      scanAngle += 0.015;

      // Spatial void casing
      ctx.fillStyle = '#030712';
      ctx.fillRect(0, 0, w, h);

      // Circular microscope field
      ctx.save();
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.clip();

      // Cork woody background
      ctx.fillStyle = '#261b12';
      ctx.fillRect(cx - r, cy - r, r * 2, r * 2);

      // Draw cork cells with focus sharpness
      cells.forEach((cell, idx) => {
        const isHighlight = (idx === selectedCellIdx);
        const blurOffset = (1 - focus) * 4;

        ctx.beginPath();
        for (let a = 0; a < 6; a++) {
          const angle = (a * Math.PI) / 3;
          const px = cell.x + Math.cos(angle) * (hexRadius - 1.5) + (Math.random() - 0.5) * blurOffset;
          const py = cell.y + Math.sin(angle) * (hexRadius - 1.5) + (Math.random() - 0.5) * blurOffset;
          if (a === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();

        // Fill cell cavity (subérine / liège mort)
        if (isHighlight) {
          ctx.fillStyle = `rgba(56, 189, 248, ${0.4 + 0.3 * Math.sin(scanAngle * 3)})`;
        } else {
          ctx.fillStyle = '#140e0a';
        }
        ctx.fill();

        // Thick dead cellulose walls
        ctx.strokeStyle = isHighlight ? '#38bdf8' : '#a77f52';
        ctx.lineWidth = isHighlight ? 3.5 : 2.5 * focus;
        ctx.stroke();
      });

      // Lens vignette shadow
      const lensVignette = ctx.createRadialGradient(cx, cy, r * 0.7, cx, cy, r);
      lensVignette.addColorStop(0, 'rgba(0,0,0,0)');
      lensVignette.addColorStop(1, 'rgba(0,0,0,0.85)');
      ctx.fillStyle = lensVignette;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();

      ctx.restore();

      // Spatial eyepiece bezel ring
      ctx.strokeStyle = '#0284c7'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(cx, cy, r + 3, 0, Math.PI * 2); ctx.stroke();

      // Callout pointing to selected cell
      if (cells[selectedCellIdx]) {
        const sc = cells[selectedCellIdx];
        const calloutX = 350, calloutY = 55;
        ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(sc.x, sc.y); ctx.lineTo(calloutX - 45, calloutY + 12); ctx.stroke();

        ctx.fillStyle = '#38bdf8';
        ctx.beginPath(); ctx.arc(sc.x, sc.y, 3.5, 0, Math.PI * 2); ctx.fill();

        // Badge
        ctx.fillStyle = 'rgba(10, 16, 32, 0.9)';
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.4)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.roundRect(calloutX - 50, calloutY - 8, 140, 42, 4); ctx.fill(); ctx.stroke();

        ctx.fillStyle = '#38bdf8'; ctx.font = 'bold 8.5px Consolas, monospace'; ctx.textAlign = 'left';
        ctx.fillText("« Cellule » (1665)", calloutX - 42, calloutY + 8);
        ctx.fillStyle = '#94a3b8'; ctx.font = '7.5px Consolas, monospace';
        ctx.fillText("Paroi morte de liège (~25 µm)", calloutX - 42, calloutY + 22);
      }

      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);

    // Controls
    const focusBtn = document.getElementById('btn-hooke-focus');
    if (focusBtn) focusBtn.addEventListener('click', () => {
      autoFocus = !autoFocus;
      focus = autoFocus ? 0.3 : 1.0;
      focusBtn.classList.toggle('active', autoFocus);
      const tag = document.getElementById('hooke-tag');
      if (tag) tag.textContent = autoFocus ? 'Mise au point : Recherche...' : 'Mise au point : Nette';
    });

    const highlightBtn = document.getElementById('btn-hooke-highlight');
    if (highlightBtn) highlightBtn.addEventListener('click', () => {
      selectedCellIdx = (selectedCellIdx + 7) % cells.length;
    });

    cData.canvas.addEventListener('click', (e) => {
      const rect = cData.canvas.getBoundingClientRect();
      const mx = (e.clientX - rect.left) * (w / rect.width);
      const my = (e.clientY - rect.top) * (h / rect.height);
      let closestIdx = 0, minDist = 9999;
      cells.forEach((cell, idx) => {
        const d = Math.hypot(cell.x - mx, cell.y - my);
        if (d < minDist) { minDist = d; closestIdx = idx; }
      });
      selectedCellIdx = closestIdx;
    });
  })();

  /* ── 4. LEEUWENHOEK LIVING CELLS ENGINE ── */
  (function initLeeuwenhoek() {
    const cData = getDPRCanvas('canvas-leeu', 460, 270);
    if (!cData) return;
    const { ctx, w, h } = cData;
    const cx = 230, cy = 135, r = 110;

    let speedMult = 1.0;
    let mouseX = -100, mouseY = -100;

    // Create organisms
    const organisms = [];
    function spawnOrganism(type) {
      const angle = Math.random() * Math.PI * 2;
      const dist = Math.random() * (r - 25);
      return {
        type: type || ['paramecium', 'bacillus', 'spirillum', 'sperm'][Math.floor(Math.random() * 4)],
        x: cx + Math.cos(angle) * dist,
        y: cy + Math.sin(angle) * dist,
        vx: (Math.random() - 0.5) * 1.4,
        vy: (Math.random() - 0.5) * 1.4,
        angle: Math.random() * Math.PI * 2,
        phase: Math.random() * 10
      };
    }

    for (let i = 0; i < 3; i++) organisms.push(spawnOrganism('paramecium'));
    for (let i = 0; i < 7; i++) organisms.push(spawnOrganism('bacillus'));
    for (let i = 0; i < 4; i++) organisms.push(spawnOrganism('spirillum'));
    for (let i = 0; i < 3; i++) organisms.push(spawnOrganism('sperm'));

    function draw() {
      // Spatial void background
      ctx.fillStyle = '#030712';
      ctx.fillRect(0, 0, w, h);

      // Droplet field
      ctx.save();
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.clip();

      const waterGrad = ctx.createRadialGradient(cx, cy, 20, cx, cy, r);
      waterGrad.addColorStop(0, '#0e7490');
      waterGrad.addColorStop(0.65, '#082f49');
      waterGrad.addColorStop(1, '#030712');
      ctx.fillStyle = waterGrad;
      ctx.fillRect(cx - r, cy - r, r * 2, r * 2);

      // Microscopic organisms update and draw
      organisms.forEach(org => {
        org.phase += 0.15 * speedMult;

        // Repel from cursor
        const dm = Math.hypot(org.x - mouseX, org.y - mouseY);
        if (dm < 45) {
          org.vx += ((org.x - mouseX) / dm) * 0.4;
          org.vy += ((org.y - mouseY) / dm) * 0.4;
        }

        // Move
        org.x += org.vx * speedMult;
        org.y += org.vy * speedMult;
        org.angle = Math.atan2(org.vy, org.vx);

        // Keep inside droplet
        const distFromCenter = Math.hypot(org.x - cx, org.y - cy);
        if (distFromCenter > r - 16) {
          const normAngle = Math.atan2(org.y - cy, org.x - cx);
          org.vx -= Math.cos(normAngle) * 0.3;
          org.vy -= Math.sin(normAngle) * 0.3;
        }

        // Friction and speed cap
        const spd = Math.hypot(org.vx, org.vy);
        if (spd > 2.5) { org.vx *= 0.95; org.vy *= 0.95; }
        if (spd < 0.4) { org.vx *= 1.05; org.vy *= 1.05; }

        ctx.save();
        ctx.translate(org.x, org.y);
        ctx.rotate(org.angle);

        if (org.type === 'paramecium') {
          // Protozoan body
          ctx.fillStyle = 'rgba(110, 231, 183, 0.75)';
          ctx.strokeStyle = '#34d399';
          ctx.lineWidth = 1.2;
          ctx.beginPath(); ctx.ellipse(0, 0, 16, 7, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          // Cilia
          ctx.strokeStyle = '#6ee7b7'; ctx.lineWidth = 0.8;
          for (let s = -12; s <= 12; s += 3) {
            const wave = Math.sin(org.phase + s);
            ctx.beginPath(); ctx.moveTo(s, -7); ctx.lineTo(s, -11 + wave); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(s, 7); ctx.lineTo(s, 11 - wave); ctx.stroke();
          }
        } else if (org.type === 'bacillus') {
          // Rod bacterium with spinning flagellum
          ctx.fillStyle = '#38bdf8'; ctx.strokeStyle = '#0284c7'; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.roundRect(-8, -3.5, 16, 7, 3.5); ctx.fill(); ctx.stroke();
          // Flagella
          ctx.strokeStyle = '#7dd3fc'; ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(-8, 0);
          ctx.quadraticCurveTo(-14, Math.sin(org.phase) * 5, -20, 0);
          ctx.stroke();
        } else if (org.type === 'spirillum') {
          // Corkscrew spiral bacterium
          ctx.strokeStyle = '#f472b6'; ctx.lineWidth = 1.8;
          ctx.beginPath();
          for (let xStep = -10; xStep <= 10; xStep += 2) {
            const yStep = Math.sin(org.phase + xStep * 0.5) * 3.5;
            if (xStep === -10) ctx.moveTo(xStep, yStep); else ctx.lineTo(xStep, yStep);
          }
          ctx.stroke();
        } else if (org.type === 'sperm') {
          // Motile cell with undulating flagellum
          ctx.fillStyle = '#fde047';
          ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = '#fef08a'; ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          for (let tx = 0; tx > -22; tx -= 2) {
            const ty = Math.sin(org.phase + tx * 0.45) * 4.5;
            ctx.lineTo(tx, ty);
          }
          ctx.stroke();
        }

        ctx.restore();
      });

      // Lens vignette & reflection
      const dropShimmer = ctx.createRadialGradient(cx - 30, cy - 30, 10, cx, cy, r);
      dropShimmer.addColorStop(0, 'rgba(255,255,255,0.18)');
      dropShimmer.addColorStop(1, 'rgba(0,0,0,0.5)');
      ctx.fillStyle = dropShimmer;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();

      ctx.restore();

      // Outer spatial frame
      ctx.strokeStyle = '#0284c7'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(cx, cy, r + 3, 0, Math.PI * 2); ctx.stroke();

      const countBadge = document.getElementById('leeu-count-badge');
      if (countBadge) countBadge.textContent = organisms.length + ' animalcules vivants';

      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);

    // Interaction
    cData.canvas.addEventListener('mousemove', (e) => {
      const rect = cData.canvas.getBoundingClientRect();
      mouseX = (e.clientX - rect.left) * (w / rect.width);
      mouseY = (e.clientY - rect.top) * (h / rect.height);
    });
    cData.canvas.addEventListener('mouseleave', () => { mouseX = -100; mouseY = -100; });

    const addBtn = document.getElementById('btn-leeu-add');
    if (addBtn) addBtn.addEventListener('click', () => {
      for (let k = 0; k < 4; k++) organisms.push(spawnOrganism());
    });
    const spdBtn = document.getElementById('btn-leeu-speed');
    if (spdBtn) spdBtn.addEventListener('click', () => {
      speedMult = speedMult === 1.0 ? 1.8 : 1.0;
      spdBtn.classList.toggle('active', speedMult > 1.0);
    });
  })();

  /* ── 5. ROBERT BROWN ENGINE (CLEAN, FLUID & VISUAL) ── */
  (function initBrown() {
    const cData = getDPRCanvas('canvas-brown', 460, 270);
    if (!cData) return;
    const { canvas, ctx, w, h } = cData;

    let step = 1; // 1: Tissu, 2: Cellule, 3: Noyau
    let currentZoom = 1.0;
    let targetZoom = 1.0;
    let time = 0;

    // Viewport center
    const cx = w / 2;
    const cy = h / 2;

    // Grid of plant cells (orchid / onion epidermis pattern)
    const cellW = 106;
    const cellH = 62;
    const cells = [];

    for (let r = -2; r <= 2; r++) {
      const rowY = cy + r * cellH;
      const stagger = (Math.abs(r) % 2 === 1) ? cellW / 2 : 0;
      for (let c = -3; c <= 3; c++) {
        const cellX = cx + c * cellW + stagger;
        const isCenter = (r === 0 && c === 0);
        const jx = isCenter ? 0 : Math.sin(r * 3 + c * 5) * 3;
        const jy = isCenter ? 0 : Math.cos(r * 4 + c * 2) * 2;
        cells.push({
          x: cellX,
          y: rowY,
          w: cellW - 6,
          h: cellH - 6,
          nx: cellX + jx,
          ny: rowY + jy,

    ctx.save();

    const padX = 7;
    const textW = ctx.measureText(text).width;
    const boxW = textW + padX * 2;
    const boxH = 17;
    let bx = x - boxW / 2;
    if (align === 'left') bx = x;
    if (align === 'right') bx = x - boxW;
    const by = y - boxH / 2;

    ctx.fillStyle = 'rgba(3, 7, 18, 0.88)';
    ctx.strokeStyle = borderColor || '#38bdf8';
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.roundRect(bx, by, boxW, boxH, 5);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#f8fafc';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, bx + boxW / 2, by + boxH / 2 + 0.5);
    ctx.restore();
  }

  /* ── 8. VIRCHOW ENGINE (1855 : OMNIS CELLULA E CELLULA — DIVISION CELLULAIRE) ── */
  (function initVirchow() {
    const cData = getDPRCanvas('canvas-virchow', 460, 270);
    if (!cData) return;
    const { canvas, ctx, w, h } = cData;
    const cx = w / 2, cy = h / 2 - 6;

    let prog = 0; // 0.0 to 1.0
    let targetProg = null;
    let playing = true;

    function drawOrganicDividingCell(sep, pinch, radius) {
      // Smooth peanut / figure-8 contour using parametric angle
      ctx.beginPath();
      const steps = 80;
      for (let i = 0; i <= steps; i++) {
        const theta = (i / steps) * Math.PI * 2;
        const cosT = Math.cos(theta);
        const sinT = Math.sin(theta);

        // Stretch horizontally by `sep`, pinch vertically near x=0 (where cosT ~ 0)
        const rx = (radius + sep) * cosT;
        const waistFactor = 1 - pinch * Math.pow(1 - cosT * cosT, 1.6);
        const ry = radius * sinT * waistFactor;

        if (i === 0) ctx.moveTo(cx + rx, cy + ry);
        else ctx.lineTo(cx + rx, cy + ry);
      }
      ctx.closePath();
    }

    function draw() {
      if (playing && targetProg === null) {
        prog += 0.0028;
        if (prog > 1) prog = 0;
      } else if (targetProg !== null) {
        prog += (targetProg - prog) * 0.08;
      }

      ctx.fillStyle = '#030712';
      ctx.fillRect(0, 0, w, h);

      // Determine stage name
      const tag = document.getElementById('virchow-tag');
      let stageTitle = '1. Cellule mère préexistante';
      if (prog >= 0.30 && prog < 0.72) stageTitle = '2. Duplication & Séparation du noyau';
      else if (prog >= 0.72) stageTitle = '3. Deux cellules filles identiques';
      if (tag) tag.textContent = stageTitle;

      const baseR = 46;

      if (prog < 0.72) {
        // Single cell stretching and pinching
        const p = Math.max(0, (prog - 0.15) / 0.57); // 0 to 1 during division
        const sep = p * 44;
        const pinch = Math.min(0.88, Math.pow(p, 1.3) * 0.92);

        ctx.fillStyle = 'rgba(16, 185, 129, 0.18)';
        ctx.strokeStyle = '#10b981';
        ctx.lineWidth = 2.8;
        drawOrganicDividingCell(sep, pinch, baseR);
        ctx.fill();
        ctx.stroke();

        // Spindle fibers during division
        if (p > 0.05) {
          const poleX = 18 + sep * 0.85;
          ctx.strokeStyle = `rgba(56, 189, 248, ${0.35 * Math.sin(p * Math.PI)})`;
          ctx.lineWidth = 1;
          for (let k = -2; k <= 2; k++) {
            ctx.beginPath();
            ctx.moveTo(cx - poleX, cy);
            ctx.quadraticCurveTo(cx, cy + k * 12, cx + poleX, cy);
            ctx.stroke();
          }
        }

        // Nuclei / Chromosomes separating
        const nucSep = Math.pow(p, 1.1) * 46;
        [-1, 1].forEach(dir => {
          if (p < 0.12 && dir === 1) return; // single nucleus at very start
          const nx = p < 0.12 ? cx : cx + dir * nucSep;
          const nucR = p < 0.12 ? 18 : 14;

          ctx.fillStyle = '#1e293b';
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 1.8;
          ctx.setLineDash(p > 0.15 && p < 0.8 ? [3, 2] : []);
          ctx.beginPath();
          ctx.arc(nx, cy, nucR, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.setLineDash([]);

          // Genetic filaments (chromosomes)
          ctx.strokeStyle = '#fbbf24';
          ctx.lineWidth = 2;
          for (let c = -1; c <= 1; c++) {
            const cxOff = nx + c * 4;
            ctx.beginPath();
            ctx.moveTo(cxOff - 3, cy - 4);
            ctx.lineTo(cxOff + 3, cy + 4);
            ctx.moveTo(cxOff + 3, cy - 4);
            ctx.lineTo(cxOff - 3, cy + 4);
            ctx.stroke();
          }
        });

        // Cleavage furrow arrows
        if (p > 0.35) {
          ctx.strokeStyle = '#f43f5e';
          ctx.lineWidth = 1.6;
          const arrowY = baseR * (1 - pinch) + 14;
          // Top arrow pointing down
          ctx.beginPath();
          ctx.moveTo(cx, cy - arrowY - 12); ctx.lineTo(cx, cy - arrowY);
          ctx.stroke();
          // Bottom arrow pointing up
          ctx.beginPath();
          ctx.moveTo(cx, cy + arrowY + 12); ctx.lineTo(cx, cy + arrowY);
          ctx.stroke();
        }

      } else {
        // Two separated identical daughter cells
        const p2 = (prog - 0.72) / 0.28; // 0 to 1
        const cellDist = 52 + p2 * 18;
        const cellR = 40;

        [-1, 1].forEach((dir, idx) => {
          const dcx = cx + dir * cellDist;
          ctx.fillStyle = 'rgba(16, 185, 129, 0.2)';
          ctx.strokeStyle = '#10b981';
          ctx.lineWidth = 2.8;
          ctx.beginPath();
          ctx.arc(dcx, cy, cellR, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          // Reformed nucleus
          ctx.fillStyle = '#1e293b';
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 1.8;
          ctx.beginPath();
          ctx.arc(dcx, cy, 14, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          // Chromatin inside
          ctx.strokeStyle = '#fbbf24';
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.arc(dcx - 3, cy, 5, 0, Math.PI);
          ctx.arc(dcx + 3, cy, 5, Math.PI, Math.PI * 2);
          ctx.stroke();

          drawLabelPill(ctx, dcx, cy + cellR + 16, `Cellule fille ${idx + 1}`, '#10b981', 'center');
        });
      }

      // Top header pill
      drawLabelPill(ctx, cx, 24, stageTitle, '#38bdf8', 'center');

      // Bottom timeline progress bar
      const barX = 45, barY = h - 18, barW = w - 90;
      ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
      ctx.fillRect(barX, barY, barW, 4);
      ctx.fillStyle = '#10b981';
      ctx.fillRect(barX, barY, barW * prog, 4);

      [0.12, 0.50, 0.86].forEach(tick => {
        ctx.fillStyle = prog >= tick ? '#10b981' : '#475569';
        ctx.beginPath();
        ctx.arc(barX + barW * tick, barY + 2, 4, 0, Math.PI * 2);
        ctx.fill();
      });

      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);

    const b1 = document.getElementById('btn-virchow-s1');
    const b2 = document.getElementById('btn-virchow-s2');
    const b3 = document.getElementById('btn-virchow-s3');
    const bT = document.getElementById('btn-virchow-toggle');

    function jumpTo(val, btn) {
      playing = false;
      targetProg = val;
      [b1, b2, b3, bT].forEach(b => { if (b) b.classList.remove('active'); });
      if (btn) btn.classList.add('active');
      if (bT) bT.textContent = '▶ Lecture';
    }

    if (b1) b1.addEventListener('click', () => jumpTo(0.10, b1));
    if (b2) b2.addEventListener('click', () => jumpTo(0.52, b2));
    if (b3) b3.addEventListener('click', () => jumpTo(0.88, b3));
    if (bT) bT.addEventListener('click', () => {
      playing = !playing;
      targetProg = null;
      [b1, b2, b3].forEach(b => { if (b) b.classList.remove('active'); });
      bT.classList.toggle('active', playing);
      bT.textContent = playing ? '⏸ Pause' : '▶ Lecture';
    });

    canvas.addEventListener('click', () => {
      if (prog < 0.35) jumpTo(0.52, b2);
      else if (prog < 0.75) jumpTo(0.88, b3);
      else jumpTo(0.10, b1);
    });
  })();

          ctx.fillStyle = c.isTumor

            : 'rgba(16, 185, 129, 0.28)';
          ctx.strokeStyle = c.isTumor ? '#f43f5e' : '#10b981';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(c.x, c.y, r, 0, Math.PI * 2);

          // Nucleus

          ctx.strokeStyle = c.isTumor ? '#fda4af' : '#38bdf8';

          ctx.arc(c.x, c.y, r * 0.42, 0, Math.PI * 2);
          ctx.fill(); ctx.stroke();

        if (remainingTumors === 0 && Math.random() < 0.02) {

  /* ── 10. MIESCHER ENGINE (1869 : EXTRACTION DE LA NUCLÉINE / ADN DU NOYAU) ── */
  (function initMiescher() {
    const cData = getDPRCanvas('canvas-miescher', 460, 270);
    if (!cData) return;
    const { canvas, ctx, w, h } = cData;
    const cx = w / 2, cy = h / 2 - 4;

    let step = 1; // 1: Globule blanc, 2: Noyau isolé (digestion), 3: Nucléine (ADN)
    let cytoAlpha = 1.0;
    let dnaAlpha = 0.0;
    let time = 0;

    function draw() {
      time += 0.03;
      const targetCyto = step === 1 ? 1.0 : 0.0;
      const targetDna = step === 3 ? 1.0 : 0.0;
      cytoAlpha += (targetCyto - cytoAlpha) * 0.08;
      dnaAlpha += (targetDna - dnaAlpha) * 0.08;

      ctx.fillStyle = '#030712';
      ctx.fillRect(0, 0, w, h);

      // ── 1. OUTER CYTOPLASM OF WHITE BLOOD CELL (fades out in step 2 & 3) ──
      if (cytoAlpha > 0.02) {
        ctx.save();
        ctx.globalAlpha = cytoAlpha;
        const cellR = 64 + (1 - cytoAlpha) * 22;

        ctx.fillStyle = 'rgba(30, 58, 138, 0.38)';
        ctx.strokeStyle = '#60a5fa';
        ctx.lineWidth = 2.4;
        ctx.setLineDash(step > 1 ? [5, 5] : []);
        ctx.beginPath();
        for (let a = 0; a <= Math.PI * 2; a += 0.12) {
          const r = cellR + Math.sin(a * 5 + time) * 3.5;
          const px = cx + Math.cos(a) * r;
          const py = cy + Math.sin(a) * r;
          if (a === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.setLineDash([]);

        // Cytoplasmic protein granules
        for (let g = 0; g < 14; g++) {
          const a = (g * Math.PI * 2) / 14 + time * 0.25;
          const d = 44 + (g % 2) * 10 + (1 - cytoAlpha) * 28;
          ctx.fillStyle = '#93c5fd';
          ctx.beginPath();
          ctx.arc(cx + Math.cos(a) * d, cy + Math.sin(a) * d, 2.2, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      // ── 2. CENTRAL NUCLEUS (always present, resistant to pepsin enzymes) ──
      const nucR = 32 + dnaAlpha * 18;
      const nucGlow = ctx.createRadialGradient(cx, cy, 4, cx, cy, nucR * 1.7);
      nucGlow.addColorStop(0, 'rgba(56, 189, 248, 0.35)');
      nucGlow.addColorStop(1, 'transparent');
      ctx.fillStyle = nucGlow;
      ctx.beginPath(); ctx.arc(cx, cy, nucR * 1.7, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = '#0f172a';
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2.6;
      ctx.beginPath();
      ctx.arc(cx, cy, nucR, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // ── 3. NUCLEIN / DNA DOUBLE STRAND & PHOSPHORUS (emerges in step 3) ──
      if (dnaAlpha > 0.02) {
        ctx.save();
        ctx.globalAlpha = dnaAlpha;

        // Uncoiling Nuclein / DNA ribbon across center
        for (let dx = -34; dx <= 34; dx += 3) {
          const a = time * 2 + dx * 0.14;
          const dy1 = Math.sin(a) * 14;
          const dy2 = -dy1;

          if (Math.abs(dx) % 6 < 3) {
            ctx.strokeStyle = 'rgba(250, 204, 21, 0.55)';
            ctx.lineWidth = 1.4;
            ctx.beginPath();
            ctx.moveTo(cx + dx, cy + dy1);
            ctx.lineTo(cx + dx, cy + dy2);
            ctx.stroke();
          }

          ctx.fillStyle = '#38bdf8';
          ctx.beginPath(); ctx.arc(cx + dx, cy + dy1, 2.4, 0, Math.PI * 2); ctx.fill();

          ctx.fillStyle = '#34d399';
          ctx.beginPath(); ctx.arc(cx + dx, cy + dy2, 2.4, 0, Math.PI * 2); ctx.fill();
        }

        // Orbiting Phosphorus (P) badges
        for (let p = 0; p < 6; p++) {
          const a = time * 0.6 + (p * Math.PI * 2) / 6;
          const px = cx + Math.cos(a) * (nucR + 22);
          const py = cy + Math.sin(a) * (nucR + 14);
          ctx.fillStyle = '#facc15';
          ctx.beginPath(); ctx.arc(px, py, 7, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#030712';
          ctx.font = 'bold 8px Consolas, monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('P', px, py + 0.5);
          ctx.textBaseline = 'alphabetic';
        }
        ctx.restore();
      }

      // Clean contextual leader labels per step
      if (step === 1) {
        drawLabelPill(ctx, cx, 22, '1. Globule blanc (extrait du pus chirurgical)', '#60a5fa', 'center');
        drawLabelPill(ctx, cx + 95, cy - 42, 'Cytoplasme (protéines)', '#60a5fa', 'center');
        drawLabelPill(ctx, cx, cy, 'Noyau', '#38bdf8', 'center');
      } else if (step === 2) {
        drawLabelPill(ctx, cx, 22, '2. Les enzymes digèrent les protéines, le noyau résiste', '#38bdf8', 'center');
        drawLabelPill(ctx, cx, cy + nucR + 24, 'Noyau pur isolé intact', '#38bdf8', 'center');
      } else {
        drawLabelPill(ctx, cx, 22, '3. Précipitation de la « Nucléine » au cœur du noyau', '#34d399', 'center');
        drawLabelPill(ctx, cx, cy + nucR + 32, 'Nucléine riche en Phosphore (P) = ADN !', '#facc15', 'center');
      }

      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);

    const b1 = document.getElementById('btn-miescher-s1');
    const b2 = document.getElementById('btn-miescher-s2');
    const b3 = document.getElementById('btn-miescher-s3');
    const tag = document.getElementById('miescher-tag');

    function setStep(s) {
      step = s;
      [b1, b2, b3].forEach(b => { if (b) b.classList.remove('active'); });
      if (s === 1 && b1) b1.classList.add('active');
      if (s === 2 && b2) b2.classList.add('active');
      if (s === 3 && b3) b3.classList.add('active');
      const labels = {
        1: '1. Globule blanc intact',
        2: '2. Noyau isolé (digestion des protéines)',
        3: '3. « Nucléine » extraite (ADN riche en P)'
      };
      if (tag) tag.textContent = labels[s];
    }

    if (b1) b1.addEventListener('click', () => setStep(1));
    if (b2) b2.addEventListener('click', () => setStep(2));
    if (b3) b3.addEventListener('click', () => setStep(3));

    canvas.addEventListener('click', () => {
      setStep(step === 3 ? 1 : step + 1);
    });
  })();

  /* ── 11. RUSKA & KNOLL ENGINE (1931 : MICROSCOPE ÉLECTRONIQUE VS OPTIQUE) ── */
  (function initRuska() {

        const amp = mode === 'optical' ? 18 : 4.5;

      ctx.stroke();

      // Lenses on the column

          ctx.strokeStyle = '#eab308';

        nGrad.addColorStop(1, 'rgba(56, 189, 248, 0.05)');

        [ [32, -18], [26, 22], [-34, 26] ].forEach(([ox, oy]) => {

  /* ── 12. WATSON, CRICK & FRANKLIN ENGINE (1953 : CLICHÉ 51, DOUBLE HÉLICE & DUPLICATION) ── */

              ctx.fillStyle = idx === 3 ? 'rgba(15, 23, 42, 0.92)' : 'rgba(15, 23, 42, 0.78)';
              ctx.beginPath();
              ctx.ellipse(sx, sy, 9, 3.8, -armAngle * 0.4, 0, Math.PI * 2);

        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(px, py, pr, 0, Math.PI * 2); ctx.stroke();

        drawLabelPill(ctx, px, 22, '« Cliché 51 » (Rosalind Franklin, 1952)', '#38bdf8', 'center');
        drawLabelPill(ctx, px, h - 18, 'Croix en « X » = Signature d\'une hélice', '#38bdf8', 'center');

      } else if (mode === 'helix') {
        // ── VIEW 2: CLEAN 3D DOUBLE HELIX WITH COMPLEMENTARY BASES (A-T, C-G) ──

        const legendItems = [

          { b: 'T', name: 'Thymine',  col: baseColors.T, y: 102 },
          { b: 'C', name: 'Cytosine', col: baseColors.C, y: 134 },
          { b: 'G', name: 'Guanine',  col: baseColors.G, y: 156 }
        ];
        legendItems.forEach(it => {

          ctx.font = '8.5px Segoe UI, sans-serif';
          ctx.textAlign = 'left';
          ctx.fillText(it.name, 46, it.y + 1);
        });

        ctx.fillStyle = '#94a3b8';
        ctx.font = 'bold 8px Consolas, monospace';
        ctx.fillText('Règle : A = T | C ≡ G', 24, 192);

          const angle = time * 1.6 + i * 0.55;
          const x1 = hcx + Math.cos(angle) * radius;
          const x2 = hcx - Math.cos(angle) * radius;
          const z = Math.sin(angle);

          ctx.strokeStyle = baseColors[b1];
          ctx.lineWidth = 4.5 + z * 1.2;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(x1, y);
          ctx.lineTo(midX - (x2 > x1 ? 3 : -3), y);
          ctx.stroke();

          // Rung half 2 (b2)
          ctx.strokeStyle = baseColors[b2];
          ctx.beginPath();
          ctx.moveTo(midX + (x2 > x1 ? 3 : -3), y);
          ctx.lineTo(x2, y);
          ctx.stroke();

          ctx.fillStyle = '#ffffff';
          ctx.beginPath(); ctx.arc(midX, y, 1.6, 0, Math.PI * 2); ctx.fill();

          // Show crisp base letters when rung is wide across front
          if (Math.abs(x2 - x1) > 65) {
            const lx1 = (x1 + midX) / 2;

            ctx.fillStyle = '#030712';
            ctx.beginPath(); ctx.arc(lx1, y, 5.5, 0, Math.PI * 2); ctx.fill();

          ctx.strokeStyle = sIdx === 0 ? '#38bdf8' : '#f472b6';
          ctx.lineWidth = 3.5;
          ctx.beginPath();

          }
          ctx.stroke();

          // Backbone phosphate spheres
          pairs.forEach((_, i) => {
            const y = 30 + i * 21;
