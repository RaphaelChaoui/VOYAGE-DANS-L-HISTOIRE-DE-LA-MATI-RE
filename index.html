            const x = hcx + Math.cos(a) * radius;
            const z = Math.sin(a);
            ctx.fillStyle = sIdx === 0 ? '#38bdf8' : '#f472b6';
            ctx.beginPath();
            ctx.arc(x, y, 4 + z * 1.2, 0, Math.PI * 2);
            ctx.fill();
          });
        });

      } else {
        // ── VIEW 3: DNA DUPLICATION (EACH STRAND SERVES AS TEMPLATE) ──
        // Top half (y: 18..115): Parent double helix unzipping at y = 115
        // Bottom half (y: 115..235): Two daughter double helices forming!
        const forkY = 105;

        for (let i = 0; i < 10; i++) {
          const y = 24 + i * 21;
          const [b1, b2] = pairs[i];

          if (y < forkY) {
            // Parent intact strand at top
            const x1 = cx - 34;
            const x2 = cx + 34;
            ctx.strokeStyle = baseColors[b1];
            ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(cx - 2, y); ctx.stroke();
            ctx.strokeStyle = baseColors[b2];
            ctx.beginPath(); ctx.moveTo(cx + 2, y); ctx.lineTo(x2, y); ctx.stroke();

            ctx.fillStyle = '#38bdf8';
            ctx.beginPath(); ctx.arc(x1, y, 4, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#f472b6';
            ctx.beginPath(); ctx.arc(x2, y, 4, 0, Math.PI * 2); ctx.fill();
          } else {
            // Separated into Left Daughter Helix and Right Daughter Helix!
            const spread = ((y - forkY) / 130) * 85;
            const leftOuterX = cx - 34 - spread;
            const leftInnerX = leftOuterX + 44;

            const rightOuterX = cx + 34 + spread;
            const rightInnerX = rightOuterX - 44;

            // Left template strand + newly synthesized complementary strand
            ctx.strokeStyle = baseColors[b1];
            ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(leftOuterX, y); ctx.lineTo(leftOuterX + 20, y); ctx.stroke();

            ctx.strokeStyle = baseColors[b2];
            ctx.beginPath(); ctx.moveTo(leftOuterX + 24, y); ctx.lineTo(leftInnerX, y); ctx.stroke();

            ctx.fillStyle = '#38bdf8';
            ctx.beginPath(); ctx.arc(leftOuterX, y, 4, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#34d399'; // New strand
            ctx.beginPath(); ctx.arc(leftInnerX, y, 4, 0, Math.PI * 2); ctx.fill();

            // Right template strand + newly synthesized complementary strand
            ctx.strokeStyle = baseColors[b2];
            ctx.beginPath(); ctx.moveTo(rightOuterX, y); ctx.lineTo(rightOuterX - 20, y); ctx.stroke();

            ctx.strokeStyle = baseColors[b1];
            ctx.beginPath(); ctx.moveTo(rightOuterX - 24, y); ctx.lineTo(rightInnerX, y); ctx.stroke();

            ctx.fillStyle = '#f472b6';
            ctx.beginPath(); ctx.arc(rightOuterX, y, 4, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#34d399'; // New strand
            ctx.beginPath(); ctx.arc(rightInnerX, y, 4, 0, Math.PI * 2); ctx.fill();
          }
        }

        drawLabelPill(ctx, cx, 14, 'ADN Parent (se sépare au centre)', '#38bdf8', 'center');
        drawLabelPill(ctx, cx - 105, h - 16, 'Copie identique 1', '#34d399', 'center');
        drawLabelPill(ctx, cx + 105, h - 16, 'Copie identique 2', '#34d399', 'center');
      }

      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);

    const bP = document.getElementById('btn-dna-photo51');
    const bH = document.getElementById('btn-dna-helix');
    const bR = document.getElementById('btn-dna-rep');
    const tag = document.getElementById('dna-tag');

    function setMode(m) {
      mode = m;
      [bP, bH, bR].forEach(b => { if (b) b.classList.remove('active'); });
      if (m === 'photo51' && bP) bP.classList.add('active');
      if (m === 'helix' && bH) bH.classList.add('active');
      if (m === 'rep' && bR) bR.classList.add('active');

      const labels = {
        photo51: '1. Cliché 51 de Rosalind Franklin (Rayons X)',
        helix: '2. Double hélice (paires A-T et C-G)',
        rep: '3. Duplication : chaque brin sert de matrice'
      };
      if (tag) tag.textContent = labels[m];
    }

    if (bP) bP.addEventListener('click', () => setMode('photo51'));
    if (bH) bH.addEventListener('click', () => setMode('helix'));
    if (bR) bR.addEventListener('click', () => setMode('rep'));

    canvas.addEventListener('click', () => {
      setMode(mode === 'photo51' ? 'helix' : (mode === 'helix' ? 'rep' : 'photo51'));
    });
  })();

  /* ── NEW ENGINE 6: ALBERT EINSTEIN (1915 : RELATIVITÉ GÉNÉRALE & ESPACE-TEMPS) ── */
  (function initEinstein1915() {
    const cData = getDPRCanvas('canvas-einstein1915', 460, 270);
    if (!cData) return;
    const { canvas, ctx, w, h } = cData;
    const cx = w / 2, cy = h / 2 - 8;

    let heavy = false;
    let wellDepth = 46;
    let time = 0;

    function projectPoint(gx, gz) {
      const dist = Math.hypot(gx, gz);
      const sink = wellDepth * Math.exp(-(dist * dist) / (heavy ? 5200 : 4200));
      const px = cx + (gx - gz) * 0.88;
      const py = cy + (gx + gz) * 0.36 + sink;
      return { x: px, y: py };
    }

    function draw() {
      time += 0.03;
      const targetDepth = heavy ? 78 : 44;
      wellDepth += (targetDepth - wellDepth) * 0.08;

      ctx.fillStyle = '#030712';
      ctx.fillRect(0, 0, w, h);

      drawLabelPill(ctx, cx, 18, 'RELATIVITÉ GÉNÉRALE (1915) : LA MASSE COURBE L\'ESPACE-TEMPS', '#38bdf8', 'center');

      // Draw warped 3D spacetime fabric grid
      const range = 135;
      const step = 18;
      ctx.strokeStyle = heavy ? 'rgba(168, 85, 247, 0.45)' : 'rgba(56, 189, 248, 0.4)';
      ctx.lineWidth = 1.2;

      for (let gx = -range; gx <= range; gx += step) {
        ctx.beginPath();
        for (let gz = -range; gz <= range; gz += 9) {
          const pt = projectPoint(gx, gz);
          if (gz === -range) ctx.moveTo(pt.x, pt.y);
          else ctx.lineTo(pt.x, pt.y);
        }
        ctx.stroke();
      }
      for (let gz = -range; gz <= range; gz += step) {
        ctx.beginPath();
        for (let gx = -range; gx <= range; gx += 9) {
          const pt = projectPoint(gx, gz);
          if (gx === -range) ctx.moveTo(pt.x, pt.y);
          else ctx.lineTo(pt.x, pt.y);
        }
        ctx.stroke();
      }

      // Central massive star sitting in the spacetime well
      const centerPt = projectPoint(0, 0);
      const starR = heavy ? 24 : 18;
      const starGlow = ctx.createRadialGradient(centerPt.x, centerPt.y - starR * 0.4, 3, centerPt.x, centerPt.y, starR * 2);
      starGlow.addColorStop(0, '#ffffff');
      starGlow.addColorStop(0.35, heavy ? '#f43f5e' : '#f59e0b');
      starGlow.addColorStop(1, 'transparent');
      ctx.fillStyle = starGlow;
      ctx.beginPath(); ctx.arc(centerPt.x, centerPt.y - starR * 0.3, starR * 2, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = heavy ? '#f43f5e' : '#fbbf24';
      ctx.beginPath(); ctx.arc(centerPt.x, centerPt.y - starR * 0.3, starR, 0, Math.PI * 2); ctx.fill();

      // Planet orbiting along the curved spacetime valley
      const orbR = 92;
      const pGx = Math.cos(time * (heavy ? 1.5 : 1.0)) * orbR;
      const pGz = Math.sin(time * (heavy ? 1.5 : 1.0)) * orbR;
      const pPt = projectPoint(pGx, pGz);

      ctx.fillStyle = '#38bdf8';
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(pPt.x, pPt.y - 5, 7, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

      drawLabelPill(ctx, cx, 224, heavy ? 'Masse très lourde → Courbure profonde (forte gravité)' : 'Le Soleil courbe l\'espace-temps autour de lui', heavy ? '#f43f5e' : '#fbbf24', 'center');
      drawLabelPill(ctx, cx, 248, 'La planète suit la pente de l\'espace courbé (orbite)', '#38bdf8', 'center');

      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);

    const bN = document.getElementById('btn-ein-normal');
    const bH = document.getElementById('btn-ein-heavy');
    const tag = document.getElementById('einstein-tag');

    function setHeavy(val) {
      heavy = val;
      if (bN) bN.classList.toggle('active', !val);
      if (bH) bH.classList.toggle('active', val);
      if (tag) tag.textContent = !val ? '1. Masse du Soleil' : '2. Masse très lourde : forte courbure';
    }
    if (bN) bN.addEventListener('click', () => setHeavy(false));
    if (bH) bH.addEventListener('click', () => setHeavy(true));
    canvas.addEventListener('click', () => setHeavy(!heavy));
  })();

  /* ── NEW ENGINE 7: ARTHUR EDDINGTON & ALBERT EINSTEIN (1919 : ÉCLIPSE SOLAIRE) ── */
  (function initEddington1919() {
    const cData = getDPRCanvas('canvas-eddington1919', 460, 270);
    if (!cData) return;
    const { canvas, ctx, w, h } = cData;

    let deflected = true;
    let time = 0;

    function draw() {
      time += 0.03;
      ctx.fillStyle = '#030712';
      ctx.fillRect(0, 0, w, h);

      drawLabelPill(ctx, w / 2, 18, 'OBSERVATION D\'EDDINGTON LORS DE L\'ÉCLIPSE SOLAIRE (1919)', '#38bdf8', 'center');

      const sunX = 230, sunY = 148;
      const realStarX = 68, realStarY = 128;
      const appStarX = 68, appStarY = 62;
      const earthX = 402, earthY = 152;

      // 1. Eclipsed Sun in the center (Moon covering the Sun, corona visible)
      const corona = ctx.createRadialGradient(sunX, sunY, 22, sunX, sunY, 58);
      corona.addColorStop(0, 'rgba(253, 224, 71, 0.85)');
      corona.addColorStop(0.45, 'rgba(245, 158, 11, 0.25)');
      corona.addColorStop(1, 'transparent');
      ctx.fillStyle = corona;
      ctx.beginPath(); ctx.arc(sunX, sunY, 58, 0, Math.PI * 2); ctx.fill();

      // Moon disc blocking the Sun during total eclipse
      ctx.fillStyle = '#090d16';
      ctx.strokeStyle = '#fde047';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(sunX, sunY, 25, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      drawLabelPill(ctx, sunX, sunY + 46, 'Soleil caché par la Lune (Éclipse)', '#fbbf24', 'center');

      // 2. Earth & Eddington's telescope on the right
      ctx.fillStyle = '#38bdf8';
      ctx.strokeStyle = '#bae6fd';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(earthX, earthY, 16, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      drawLabelPill(ctx, earthX - 10, earthY + 34, 'Terre (Eddington)', '#38bdf8', 'center');

      // 3. Real Star on the left
      ctx.fillStyle = '#fde047';
      ctx.beginPath(); ctx.arc(realStarX, realStarY, 6, 0, Math.PI * 2); ctx.fill();
      drawLabelPill(ctx, realStarX + 18, realStarY + 22, 'Position réelle de l\'étoile', '#fde047', 'center');

      if (deflected) {
        // Apparent shifted star position (extension of bent ray from Earth)
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.55)';
        ctx.lineWidth = 1.6;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(earthX, earthY);
        ctx.lineTo(sunX, sunY - 36);
        ctx.lineTo(appStarX, appStarY);
        ctx.stroke();
        ctx.setLineDash([]);

        // Ghost apparent star
        ctx.fillStyle = '#38bdf8';
        ctx.beginPath(); ctx.arc(appStarX, appStarY, 6, 0, Math.PI * 2); ctx.fill();
        drawLabelPill(ctx, appStarX + 35, appStarY - 16, 'Position apparente (vue de la Terre)', '#38bdf8', 'center');

        // Actual curved light ray bent by Sun's gravity
        ctx.strokeStyle = '#fde047';
        ctx.lineWidth = 2.6;
        ctx.beginPath();
        ctx.moveTo(realStarX, realStarY);
        ctx.quadraticCurveTo(sunX, sunY - 42, earthX, earthY);
        ctx.stroke();

        // Moving photon along the curved ray
        const t = (time * 0.45) % 1;
        const px = (1 - t) * (1 - t) * realStarX + 2 * (1 - t) * t * sunX + t * t * earthX;
        const py = (1 - t) * (1 - t) * realStarY + 2 * (1 - t) * t * (sunY - 42) + t * t * earthY;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(px, py, 4, 0, Math.PI * 2); ctx.fill();

        drawLabelPill(ctx, w / 2, 245, 'Confirmation : La lumière est déviée par la gravité du Soleil !', '#10b981', 'center');
      } else {
        // Without gravitational deflection: straight ray blocked or straight line
        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(realStarX, realStarY);
        ctx.lineTo(earthX, earthY);
        ctx.stroke();

        drawLabelPill(ctx, w / 2, 245, 'Sans gravité : la lumière irait en ligne droite sans déviation', '#94a3b8', 'center');
      }

      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);

    const bE = document.getElementById('btn-edd-eclipse');
    const bS = document.getElementById('btn-edd-straight');
    const tag = document.getElementById('eddington-tag');

    function setDeflected(val) {
      deflected = val;
      if (bE) bE.classList.toggle('active', val);
      if (bS) bS.classList.toggle('active', !val);
      if (tag) tag.textContent = val ? '1. Éclipse : lumière déviée par le Soleil' : '2. Sans gravité : trajet en ligne droite';
    }
    if (bE) bE.addEventListener('click', () => setDeflected(true));
    if (bS) bS.addEventListener('click', () => setDeflected(false));
    canvas.addEventListener('click', () => setDeflected(!deflected));
  })();

  /* ── NEW ENGINE 8: EDWIN HUBBLE (1929 : LOI DE HUBBLE & EXPANSION DE L'UNIVERS) ── */
  (function initHubble1929() {
    const cData = getDPRCanvas('canvas-hubble1929', 460, 270);
    if (!cData) return;
    const { canvas, ctx, w, h } = cData;

    let mode = 'view'; // 'view' | 'graph'
    let time = 0;

    const galaxies = [
      { name: 'Galaxie A (Proche)',   baseX: 145, y: 78,  speed: 1.0, col: '#38bdf8', vText: 'v = 500 km/s' },
      { name: 'Galaxie B (Moyenne)',  baseX: 215, y: 138, speed: 2.0, col: '#fbbf24', vText: 'v = 1 000 km/s' },
      { name: 'Galaxie C (Lointaine)', baseX: 285, y: 198, speed: 3.2, col: '#f43f5e', vText: 'v = 1 600 km/s' }
    ];

    function drawSpiralGalaxy(x, y, col) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(time * 0.8);
      ctx.strokeStyle = col;
      ctx.lineWidth = 2.2;
      for (let arm = 0; arm < 2; arm++) {
        ctx.beginPath();
        for (let a = 0; a < 3.5; a += 0.2) {
          const r = a * 3.8;
          const th = a + arm * Math.PI;
          const gx = Math.cos(th) * r;
          const gy = Math.sin(th) * r * 0.65;
          if (a === 0) ctx.moveTo(gx, gy);
          else ctx.lineTo(gx, gy);
        }
        ctx.stroke();
      }
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(0, 0, 3.5, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    function draw() {
      time += 0.025;
      ctx.fillStyle = '#030712';
      ctx.fillRect(0, 0, w, h);

      if (mode === 'view') {
        drawLabelPill(ctx, w / 2, 18, 'OBSERVATION DE HUBBLE (1929) : ÉLOIGNEMENT DES GALAXIES', '#38bdf8', 'center');

        // Observer (Voie lactée / Terre) on the left
        const ox = 52;
        ctx.fillStyle = 'rgba(56, 189, 248, 0.15)';
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 1.8;
        ctx.beginPath(); ctx.roundRect(16, 46, 72, 174, 8); ctx.fill(); ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 9px Segoe UI, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('TERRE', ox, 128);
        ctx.fillStyle = '#38bdf8';
        ctx.font = '8px Segoe UI, sans-serif';
        ctx.fillText('(Télescope)', ox, 142);

        const cycle = (time * 18) % 85;

        galaxies.forEach(g => {
          const gx = g.baseX + cycle * (g.speed * 0.35);

          // Distance dashed line from Earth
          ctx.strokeStyle = 'rgba(148, 163, 184, 0.3)';
          ctx.lineWidth = 1.2;
          ctx.setLineDash([3, 3]);
          ctx.beginPath(); ctx.moveTo(88, g.y); ctx.lineTo(gx - 18, g.y); ctx.stroke();
          ctx.setLineDash([]);

          // Galaxy icon
          drawSpiralGalaxy(gx, g.y, g.col);

          // Velocity arrow (longer for farther galaxies!)
          const arrowLen = 22 * g.speed;
          ctx.strokeStyle = g.col;
          ctx.lineWidth = 2.6;
          ctx.beginPath();
          ctx.moveTo(gx + 16, g.y);
          ctx.lineTo(gx + 16 + arrowLen, g.y);
          ctx.lineTo(gx + 10 + arrowLen, g.y - 5);
          ctx.moveTo(gx + 16 + arrowLen, g.y);
          ctx.lineTo(gx + 10 + arrowLen, g.y + 5);
          ctx.stroke();

          drawLabelPill(ctx, gx, g.y - 22, g.name + ' · ' + g.vText, g.col, 'center');
        });

        drawLabelPill(ctx, w / 2, 246, 'Loi de Hubble : Plus une galaxie est loin, plus elle s\'éloigne vite !', '#10b981', 'center');

      } else {
        // Hubble's Graph: Distance (x) vs Vitesse d'éloignement (y)
        drawLabelPill(ctx, w / 2, 18, 'LOI DE HUBBLE : RELATION ENTRE DISTANCE ET VITESSE', '#38bdf8', 'center');

        const gx0 = 78, gy0 = 212, gw = 330, gh = 162;

        // Axes
        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(gx0, gy0 - gh);
        ctx.lineTo(gx0, gy0);
        ctx.lineTo(gx0 + gw, gy0);
        ctx.stroke();

        ctx.fillStyle = '#e2e8f0';
        ctx.font = 'bold 9.5px Segoe UI, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Distance de la galaxie →', gx0 + gw / 2, gy0 + 20);

        ctx.save();
        ctx.translate(28, gy0 - gh / 2);
        ctx.rotate(-Math.PI / 2);
        ctx.fillText('Vitesse d\'éloignement →', 0, 0);
        ctx.restore();

        // Linear Hubble law line
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(gx0, gy0);
        ctx.lineTo(gx0 + gw - 20, gy0 - gh + 16);
        ctx.stroke();

        // 3 Galaxy data points along the line
        [
          { f: 0.25, label: 'Galaxie A (Proche)',    col: '#38bdf8' },
          { f: 0.55, label: 'Galaxie B (Moyenne)',   col: '#fbbf24' },
          { f: 0.86, label: 'Galaxie C (Lointaine)', col: '#f43f5e' }
        ].forEach(pt => {
          const px = gx0 + (gw - 20) * pt.f;
          const py = gy0 - (gh - 16) * pt.f;
          ctx.fillStyle = pt.col;
          ctx.beginPath(); ctx.arc(px, py, 6, 0, Math.PI * 2); ctx.fill();
          drawLabelPill(ctx, px, py - 18, pt.label, pt.col, 'center');
        });

        drawLabelPill(ctx, w / 2, 248, 'Preuve directe de l\'expansion de l\'Univers', '#10b981', 'center');
      }

      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);

    const bV = document.getElementById('btn-hubble-view');
    const bG = document.getElementById('btn-hubble-graph');
    const tag = document.getElementById('hubble-tag');

    function setMode(m) {
      mode = m;
      if (bV) bV.classList.toggle('active', m === 'view');
      if (bG) bG.classList.toggle('active', m === 'graph');
      if (tag) tag.textContent = m === 'view' ? '1. Vitesse selon la distance des galaxies' : '2. Graphique Distance / Vitesse';
    }
    if (bV) bV.addEventListener('click', () => setMode('view'));
    if (bG) bG.addEventListener('click', () => setMode('graph'));
    canvas.addEventListener('click', () => setMode(mode === 'view' ? 'graph' : 'view'));
  })();

</script>
