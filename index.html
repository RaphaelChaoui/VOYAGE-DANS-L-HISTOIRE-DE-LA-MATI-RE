      ctx.beginPath(); ctx.arc(bx, 48, 7, 0, Math.PI * 2); ctx.fill();

      // Wave propagation downward (y: 55..205)
      ctx.strokeStyle = mode === 'optical' ? '#facc15' : '#38bdf8';
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let y = 55; y <= 205; y += 2) {
        // Photons: long wavelength & wide amplitude; Electrons: short wavelength & tight beam
        const freq = mode === 'optical' ? 0.14 : 0.65;
        const amp = mode === 'optical' ? 18 : 4.5;
        const wx = bx + Math.sin(y * freq - time * 3) * amp;
        if (y === 55) ctx.moveTo(wx, y);
        else ctx.lineTo(wx, y);
      }
      ctx.stroke();

      // Lenses on the column
      [105, 160].forEach((ly, idx) => {
        if (mode === 'optical') {
          // Glass lens
          ctx.fillStyle = 'rgba(250, 204, 21, 0.18)';
          ctx.strokeStyle = '#eab308';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.ellipse(bx, ly, 32, 7, 0, 0, Math.PI * 2);
          ctx.fill(); ctx.stroke();
        } else {
          // Electromagnetic coil lens
          ctx.fillStyle = 'rgba(56, 189, 248, 0.2)';
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 1.8;
          ctx.beginPath();
          ctx.roundRect(bx - 38, ly - 8, 18, 16, 3);
          ctx.roundRect(bx + 20, ly - 8, 18, 16, 3);
          ctx.fill(); ctx.stroke();
        }
      });

      drawLabelPill(
        ctx, bx, 232,
        mode === 'optical' ? 'λ longue (~500 nm)' : 'λ ultra-courte (~0.005 nm)',
        mode === 'optical' ? '#eab308' : '#38bdf8',
        'center'
      );

      // ── RIGHT PANEL: CELL OBSERVATION (x: 194..448) ──
      const rx = 194, ry = 12, rw = 254, rh = 246;
      const vcx = rx + rw / 2, vcy = ry + rh / 2;

      ctx.save();
      ctx.beginPath(); ctx.roundRect(rx, ry, rw, rh, 8); ctx.clip();

      ctx.fillStyle = mode === 'optical' ? '#0c1612' : '#04090e';
      ctx.fillRect(rx, ry, rw, rh);

      ctx.save();
      ctx.translate(vcx, vcy);
      ctx.scale(zoom, zoom);
      ctx.translate(-vcx, -vcy);

      if (mode === 'optical') {
        // Blurry low-resolution optical cell (only outline + nucleus visible)
        ctx.fillStyle = 'rgba(34, 197, 94, 0.18)';
        ctx.strokeStyle = 'rgba(74, 222, 128, 0.35)';
        ctx.lineWidth = 7;
        ctx.beginPath();
        ctx.ellipse(vcx, vcy, 78, 58, 0, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();

        // Fuzzy nucleus
        const nGrad = ctx.createRadialGradient(vcx - 16, vcy, 2, vcx - 16, vcy, 26);
        nGrad.addColorStop(0, 'rgba(56, 189, 248, 0.5)');
        nGrad.addColorStop(1, 'rgba(56, 189, 248, 0.05)');
        ctx.fillStyle = nGrad;
        ctx.beginPath(); ctx.arc(vcx - 16, vcy, 26, 0, Math.PI * 2); ctx.fill();

        // Unresolvable blurry organelle smudges
        [ [32, -18], [26, 22], [-34, 26] ].forEach(([ox, oy]) => {
          ctx.fillStyle = 'rgba(148, 163, 184, 0.14)';
          ctx.beginPath(); ctx.arc(vcx + ox, vcy + oy, 12, 0, Math.PI * 2); ctx.fill();
        });

      } else {
        // High-resolution Electron Microscope Ultrastructure!
        // Double lipid plasma membrane
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 1.5 / zoom;
        ctx.beginPath(); ctx.ellipse(vcx, vcy, 84, 62, 0, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(vcx, vcy, 81, 59, 0, 0, Math.PI * 2); ctx.stroke();

        // Nucleus with double envelope & pores (left)
        ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 1.8 / zoom;
        ctx.setLineDash([4 / zoom, 2.5 / zoom]);
        ctx.beginPath(); ctx.arc(vcx - 32, vcy, 24, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.setLineDash([]);

        // Mitochondrion at center-right (vcx + 18, vcy - 6) so zooming into (vcx, vcy) shows it clearly
        const mx = vcx + 14, my = vcy - 4;
        ctx.fillStyle = 'rgba(16, 185, 129, 0.22)';
        ctx.strokeStyle = '#10b981';
        ctx.lineWidth = 1.8 / zoom;
        ctx.beginPath();
        ctx.ellipse(mx, my, 24, 13, 0, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();

        // Inner folded cristae of mitochondrion
        ctx.strokeStyle = '#34d399';
        ctx.lineWidth = 1.3 / zoom;
        for (let cxOff = -14; cxOff <= 14; cxOff += 7) {
          ctx.beginPath();
          ctx.moveTo(mx + cxOff, my - 11);
          ctx.lineTo(mx + cxOff, my + 4);
          ctx.stroke();
        }

        // Endoplasmic reticulum & Ribosomes below
        ctx.strokeStyle = '#a855f7';
        ctx.lineWidth = 1.3 / zoom;
        for (let r = 0; r < 3; r++) {
          const ryOff = vcy + 20 + r * 7;
          ctx.beginPath();
          ctx.moveTo(vcx - 8, ryOff);
          ctx.quadraticCurveTo(vcx + 12, ryOff + 3, vcx + 32, ryOff);
          ctx.stroke();

          // Punctate ribosomes along ER
          for (let rxOff = -6; rxOff <= 30; rxOff += 6) {
            ctx.fillStyle = '#facc15';
            ctx.beginPath();
            ctx.arc(vcx + rxOff, ryOff - 2, 1.5 / Math.sqrt(zoom), 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      ctx.restore();

      // Clean non-overlapping header & footer inside right viewport
      ctx.fillStyle = 'rgba(3, 7, 18, 0.86)';
      ctx.fillRect(rx, ry, rw, 26);
      ctx.fillRect(rx, ry + rh - 26, rw, 26);

      ctx.fillStyle = mode === 'optical' ? '#facc15' : '#38bdf8';
      ctx.font = 'bold 9px Segoe UI, sans-serif';
      ctx.textAlign = 'center';
      const headText = mode === 'optical'
        ? 'OPTIQUE (×1 500) : IMAGE FLOUE'
        : (mode === 'electron' ? 'ÉLECTRONIQUE : CELLULE NETTE' : 'ULTRASTRUCTURE (×100 000)');
      ctx.fillText(headText, vcx, ry + 16);

      if (mode === 'optical') {
        drawLabelPill(ctx, vcx, ry + rh - 13, 'Ultrastructure interne invisible', '#eab308', 'center');
      } else {
        drawLabelPill(ctx, vcx - 56, ry + rh - 13, 'Mitochondrie', '#10b981', 'center');
        drawLabelPill(ctx, vcx + 52, ry + rh - 13, 'Ribosomes', '#facc15', 'center');
      }

      ctx.restore();

      ctx.strokeStyle = mode === 'optical' ? 'rgba(250, 204, 21, 0.35)' : 'rgba(56, 189, 248, 0.4)';
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.roundRect(rx, ry, rw, rh, 8); ctx.stroke();

      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);

    const bOpt = document.getElementById('btn-ruska-optical');
    const bEle = document.getElementById('btn-ruska-electron');
    const bUlt = document.getElementById('btn-ruska-ultra');
    const tag = document.getElementById('ruska-tag');

    function setMode(m) {
      mode = m;
      targetZoom = m === 'ultra' ? 2.2 : 1.0;
      [bOpt, bEle, bUlt].forEach(b => { if (b) b.classList.remove('active'); });
      if (m === 'optical' && bOpt) bOpt.classList.add('active');
      if (m === 'electron' && bEle) bEle.classList.add('active');
      if (m === 'ultra' && bUlt) bUlt.classList.add('active');

      const labels = {
        optical: '1. Lumière visible (×1 500 : limite de diffraction)',
        electron: '2. Faisceau d\'électrons (organites révélés)',
        ultra: '3. Ultrastructure (×100 000 : mitochondries & ribosomes)'
      };
      if (tag) tag.textContent = labels[m];
    }

    if (bOpt) bOpt.addEventListener('click', () => setMode('optical'));
    if (bEle) bEle.addEventListener('click', () => setMode('electron'));
    if (bUlt) bUlt.addEventListener('click', () => setMode('ultra'));

    canvas.addEventListener('click', () => {
      setMode(mode === 'optical' ? 'electron' : (mode === 'electron' ? 'ultra' : 'optical'));
    });
  })();

  /* ── 12. WATSON, CRICK & FRANKLIN ENGINE (1953 : CLICHÉ 51, DOUBLE HÉLICE & DUPLICATION) ── */
  (function initDNA() {
    const cData = getDPRCanvas('canvas-dna', 460, 270);
    if (!cData) return;
    const { canvas, ctx, w, h } = cData;
    const cx = w / 2, cy = h / 2;

    let mode = 'helix'; // 'photo51' | 'helix' | 'rep'
    let time = 0;

    const pairs = [
      ['A', 'T'], ['C', 'G'], ['T', 'A'], ['G', 'C'],
      ['A', 'T'], ['G', 'C'], ['C', 'G'], ['T', 'A'],
      ['A', 'T'], ['C', 'G'], ['G', 'C']
    ];
    const baseColors = {
      A: '#ef4444', // Adénine (Rouge)
      T: '#38bdf8', // Thymine (Bleu)
      C: '#10b981', // Cytosine (Vert)
      G: '#f59e0b'  // Guanine (Ambre)
    };

    function draw() {
      time += 0.025;
      ctx.fillStyle = '#030712';
      ctx.fillRect(0, 0, w, h);

      if (mode === 'photo51') {
        // ── VIEW 1: ROSALIND FRANKLIN'S PHOTO 51 (X-RAY DIFFRACTION) ──
        // Left side: X-ray source hitting DNA fiber
        ctx.fillStyle = 'rgba(15, 23, 42, 0.8)';
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.3)';
        ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.roundRect(14, 24, 155, 222, 8); ctx.fill(); ctx.stroke();

        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 8.5px Segoe UI, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('DIFFRACTION RAYONS X', 91, 42);

        // X-ray beam
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 3]);
        ctx.beginPath(); ctx.moveTo(26, cy); ctx.lineTo(115, cy); ctx.stroke();
        ctx.setLineDash([]);

        // DNA Fiber mount
        ctx.strokeStyle = '#f472b6';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(115, cy - 45); ctx.lineTo(115, cy + 45); ctx.stroke();

        // Diffracted cone onto photographic plate
        ctx.fillStyle = 'rgba(56, 189, 248, 0.12)';
        ctx.beginPath();
        ctx.moveTo(115, cy);
        ctx.lineTo(225, cy - 85);
        ctx.lineTo(225, cy + 85);
        ctx.closePath();
        ctx.fill();

        drawLabelPill(ctx, 91, 218, 'Fibre d\'ADN + Rayons X', '#f472b6', 'center');

        // Right side: Iconic Circular Photographic Plate "Cliché 51"
        const px = 315, py = cy, pr = 96;
        const plateGrad = ctx.createRadialGradient(px, py, 6, px, py, pr);
        plateGrad.addColorStop(0, '#e2e8f0');
        plateGrad.addColorStop(0.75, '#cbd5e1');
        plateGrad.addColorStop(1, '#64748b');
        ctx.fillStyle = plateGrad;
        ctx.beginPath(); ctx.arc(px, py, pr, 0, Math.PI * 2); ctx.fill();

        // Central lead beam stop
        ctx.fillStyle = '#0f172a';
        ctx.beginPath(); ctx.arc(px, py, 11, 0, Math.PI * 2); ctx.fill();

        // Characteristic X-cross diffraction spots
        [-0.62, 0.62].forEach(armAngle => {
          [-1, 1].forEach(dir => {
            [22, 38, 54, 82].forEach((dist, idx) => {
              const sx = px + Math.sin(armAngle) * dist * dir;
              const sy = py + Math.cos(armAngle) * dist * dir;
              ctx.fillStyle = idx === 3 ? 'rgba(15, 23, 42, 0.92)' : 'rgba(15, 23, 42, 0.78)';
              ctx.beginPath();
              ctx.ellipse(sx, sy, 9, 3.8, -armAngle * 0.4, 0, Math.PI * 2);
              ctx.fill();
            });
          });
        });

        // Outer ring
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(px, py, pr, 0, Math.PI * 2); ctx.stroke();

        drawLabelPill(ctx, px, 22, '« Cliché 51 » (Rosalind Franklin, 1952)', '#38bdf8', 'center');
        drawLabelPill(ctx, px, h - 18, 'Croix en « X » = Signature d\'une hélice', '#38bdf8', 'center');

      } else if (mode === 'helix') {
        // ── VIEW 2: CLEAN 3D DOUBLE HELIX WITH COMPLEMENTARY BASES (A-T, C-G) ──
        const hcx = cx + 45;
        const radius = 52;

        // Left legend card
        ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.roundRect(14, 38, 138, 194, 8); ctx.fill(); ctx.stroke();

        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 9px Segoe UI, sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText('PAIRES DE BASES', 24, 56);

        const legendItems = [
          { b: 'A', name: 'Adénine',  col: baseColors.A, y: 80 },
          { b: 'T', name: 'Thymine',  col: baseColors.T, y: 102 },
          { b: 'C', name: 'Cytosine', col: baseColors.C, y: 134 },
          { b: 'G', name: 'Guanine',  col: baseColors.G, y: 156 }
        ];
        legendItems.forEach(it => {
          ctx.fillStyle = it.col;
          ctx.beginPath(); ctx.roundRect(24, it.y - 9, 16, 14, 3); ctx.fill();
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 9px Consolas, monospace';
          ctx.textAlign = 'center';
          ctx.fillText(it.b, 32, it.y + 1);

          ctx.fillStyle = '#e2e8f0';
          ctx.font = '8.5px Segoe UI, sans-serif';
          ctx.textAlign = 'left';
          ctx.fillText(it.name, 46, it.y + 1);
        });

        ctx.fillStyle = '#94a3b8';
        ctx.font = 'bold 8px Consolas, monospace';
        ctx.fillText('Règle : A = T | C ≡ G', 24, 192);
        ctx.fillText('2 brins antiparallèles', 24, 210);

        // Draw base pair rungs cleanly with vector lines (no negative-width roundRect!)
        pairs.forEach(([b1, b2], i) => {
          const y = 30 + i * 21;
          const angle = time * 1.6 + i * 0.55;
          const x1 = hcx + Math.cos(angle) * radius;
          const x2 = hcx - Math.cos(angle) * radius;
          const z = Math.sin(angle);
          const midX = hcx;

          // Rung half 1 (b1)
          ctx.strokeStyle = baseColors[b1];
          ctx.lineWidth = 4.5 + z * 1.2;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(x1, y);
          ctx.lineTo(midX - (x2 > x1 ? 3 : -3), y);
          ctx.stroke();

          // Rung half 2 (b2)
          ctx.strokeStyle = baseColors[b2];
          ctx.beginPath();
          ctx.moveTo(midX + (x2 > x1 ? 3 : -3), y);
          ctx.lineTo(x2, y);
          ctx.stroke();

          // Hydrogen bond dot at center
          ctx.fillStyle = '#ffffff';
          ctx.beginPath(); ctx.arc(midX, y, 1.6, 0, Math.PI * 2); ctx.fill();

          // Show crisp base letters when rung is wide across front
          if (Math.abs(x2 - x1) > 65) {
            const lx1 = (x1 + midX) / 2;
            const lx2 = (x2 + midX) / 2;
            ctx.fillStyle = '#030712';
            ctx.beginPath(); ctx.arc(lx1, y, 5.5, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(lx2, y, 5.5, 0, Math.PI * 2); ctx.fill();

            ctx.font = 'bold 8px Consolas, monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = baseColors[b1];
            ctx.fillText(b1, lx1, y + 0.5);
            ctx.fillStyle = baseColors[b2];
            ctx.fillText(b2, lx2, y + 0.5);
            ctx.textBaseline = 'alphabetic';
          }
        });

        // Smooth continuous backbone strands
        [0, Math.PI].forEach((offset, sIdx) => {
          ctx.strokeStyle = sIdx === 0 ? '#38bdf8' : '#f472b6';
          ctx.lineWidth = 3.5;
          ctx.beginPath();
          for (let y = 20; y <= 250; y += 3) {
            const iFloat = (y - 30) / 21;
            const a = time * 1.6 + iFloat * 0.55 + offset;
            const x = hcx + Math.cos(a) * radius;
            if (y === 20) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.stroke();

          // Backbone phosphate spheres
          pairs.forEach((_, i) => {
            const y = 30 + i * 21;
            const a = time * 1.6 + i * 0.55 + offset;
            const x = hcx + Math.cos(a) * radius;
            const z = Math.sin(a);
            ctx.fillStyle = sIdx === 0 ? '#38bdf8' : '#f472b6';
            ctx.beginPath();
            ctx.arc(x, y, 4 + z * 1.2, 0, Math.PI * 2);
            ctx.fill();
          });
        });

      } else {
        // ── VIEW 3: DNA DUPLICATION (EACH STRAND SERVES AS TEMPLATE) ──
        // Top half (y: 18..115): Parent double helix unzipping at y = 115
        // Bottom half (y: 115..235): Two daughter double helices forming!
        const forkY = 105;

        for (let i = 0; i < 10; i++) {
          const y = 24 + i * 21;
          const [b1, b2] = pairs[i];

          if (y < forkY) {
            // Parent intact strand at top
            const x1 = cx - 34;
            const x2 = cx + 34;
            ctx.strokeStyle = baseColors[b1];
            ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(cx - 2, y); ctx.stroke();
            ctx.strokeStyle = baseColors[b2];
            ctx.beginPath(); ctx.moveTo(cx + 2, y); ctx.lineTo(x2, y); ctx.stroke();

            ctx.fillStyle = '#38bdf8';
            ctx.beginPath(); ctx.arc(x1, y, 4, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#f472b6';
            ctx.beginPath(); ctx.arc(x2, y, 4, 0, Math.PI * 2); ctx.fill();
          } else {
            // Separated into Left Daughter Helix and Right Daughter Helix!
            const spread = ((y - forkY) / 130) * 85;
            const leftOuterX = cx - 34 - spread;
            const leftInnerX = leftOuterX + 44;

            const rightOuterX = cx + 34 + spread;
            const rightInnerX = rightOuterX - 44;

            // Left template strand + newly synthesized complementary strand
            ctx.strokeStyle = baseColors[b1];
            ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(leftOuterX, y); ctx.lineTo(leftOuterX + 20, y); ctx.stroke();

            ctx.strokeStyle = baseColors[b2];
            ctx.beginPath(); ctx.moveTo(leftOuterX + 24, y); ctx.lineTo(leftInnerX, y); ctx.stroke();

            ctx.fillStyle = '#38bdf8';
            ctx.beginPath(); ctx.arc(leftOuterX, y, 4, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#34d399'; // New strand
            ctx.beginPath(); ctx.arc(leftInnerX, y, 4, 0, Math.PI * 2); ctx.fill();

            // Right template strand + newly synthesized complementary strand
            ctx.strokeStyle = baseColors[b2];
            ctx.beginPath(); ctx.moveTo(rightOuterX, y); ctx.lineTo(rightOuterX - 20, y); ctx.stroke();

            ctx.strokeStyle = baseColors[b1];
            ctx.beginPath(); ctx.moveTo(rightOuterX - 24, y); ctx.lineTo(rightInnerX, y); ctx.stroke();

            ctx.fillStyle = '#f472b6';
            ctx.beginPath(); ctx.arc(rightOuterX, y, 4, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#34d399'; // New strand
            ctx.beginPath(); ctx.arc(rightInnerX, y, 4, 0, Math.PI * 2); ctx.fill();
          }
        }

        drawLabelPill(ctx, cx, 14, 'ADN Parent (se sépare au centre)', '#38bdf8', 'center');
        drawLabelPill(ctx, cx - 105, h - 16, 'Copie identique 1', '#34d399', 'center');
        drawLabelPill(ctx, cx + 105, h - 16, 'Copie identique 2', '#34d399', 'center');
      }

      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);

    const bP = document.getElementById('btn-dna-photo51');
    const bH = document.getElementById('btn-dna-helix');
    const bR = document.getElementById('btn-dna-rep');
    const tag = document.getElementById('dna-tag');

    function setMode(m) {
      mode = m;
      [bP, bH, bR].forEach(b => { if (b) b.classList.remove('active'); });
      if (m === 'photo51' && bP) bP.classList.add('active');
      if (m === 'helix' && bH) bH.classList.add('active');
      if (m === 'rep' && bR) bR.classList.add('active');

      const labels = {
        photo51: '1. Cliché 51 de Rosalind Franklin (Rayons X)',
        helix: '2. Double hélice (paires A-T et C-G)',
        rep: '3. Duplication : chaque brin sert de matrice'
      };
      if (tag) tag.textContent = labels[m];
    }

    if (bP) bP.addEventListener('click', () => setMode('photo51'));
    if (bH) bH.addEventListener('click', () => setMode('helix'));
    if (bR) bR.addEventListener('click', () => setMode('rep'));

    canvas.addEventListener('click', () => {
      setMode(mode === 'photo51' ? 'helix' : (mode === 'helix' ? 'rep' : 'photo51'));
    });
  })();

</script>
